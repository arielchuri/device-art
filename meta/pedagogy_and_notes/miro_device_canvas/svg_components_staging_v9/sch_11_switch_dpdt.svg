<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Pole 1 (Top) -->
  <line x1="0" y1="42" x2="38" y2="42" stroke="#000000" stroke-width="1.5"/>
  <circle cx="38" cy="42" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="38" y1="42" x2="78" y2="28" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="28" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="28" x2="120" y2="28" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="48" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="48" x2="120" y2="48" stroke="#000000" stroke-width="1.5"/>

  <!-- Pole 2 (Bottom) -->
  <line x1="0" y1="72" x2="38" y2="72" stroke="#000000" stroke-width="1.5"/>
  <circle cx="38" cy="72" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="38" y1="72" x2="78" y2="58" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="58" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="58" x2="120" y2="58" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="78" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="78" x2="120" y2="78" stroke="#000000" stroke-width="1.5"/>

  <!-- Ganged linkage dashed line -->
  <line x1="58" y1="35" x2="58" y2="65" stroke="#888888" stroke-width="0.8" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DPDT SWITCH</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">double-pole double-throw dual-channel</text>
</svg>