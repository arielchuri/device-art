<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Base Lead from x=0 -->
  <line x1="0" y1="60" x2="48" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Base Plate Bar -->
  <line x1="48" y1="40" x2="48" y2="80" stroke="#000000" stroke-width="2.5"/>
  <!-- Emitter Arm from top right x=90, y=0 with INWARD arrow -->
  <line x1="78" y1="0" x2="78" y2="30" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="30" x2="48" y2="50" stroke="#000000" stroke-width="1.5"/>
  <!-- Inward pointing arrow on emitter -->
  <polygon points="52,52 64,46 59,38" fill="#000000"/>
  <!-- Collector Arm to bottom right x=90, y=120 -->
  <line x1="48" y1="70" x2="78" y2="90" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="90" x2="78" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="36" y="55" font-family="Andale Mono, monospace" font-size="7" fill="#888888">B</text>
  <text x="86" y="24" font-family="Andale Mono, monospace" font-size="7" fill="#888888">E</text>
  <text x="86" y="96" font-family="Andale Mono, monospace" font-size="7" fill="#888888">C</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PNP TRANSISTOR</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">high-side driver switch (BJT)</text>
</svg>