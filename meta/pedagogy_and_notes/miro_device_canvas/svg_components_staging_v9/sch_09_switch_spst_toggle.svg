<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <line x1="0" y1="60" x2="42" y2="60" stroke="#000000" stroke-width="1.5"/>
  <circle cx="42" cy="60" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Tilted Switch Blade -->
  <line x1="42" y1="60" x2="78" y2="38" stroke="#000000" stroke-width="2"/>
  <circle cx="78" cy="60" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SPST SWITCH</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">single-pole single-throw toggle</text>
</svg>