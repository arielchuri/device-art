<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Common Wiper Lead from Left x=0 -->
  <line x1="0" y1="60" x2="40" y2="60" stroke="#000000" stroke-width="1.5"/>
  <circle cx="40" cy="60" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Rotary Wiper Arm Pointing to Position 2 -->
  <line x1="40" y1="60" x2="78" y2="46" stroke="#000000" stroke-width="2"/>
  <!-- 4 Stepped Throws Reaching Right x=120 -->
  <circle cx="80" cy="28" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="28" x2="120" y2="28" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="46" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="46" x2="120" y2="46" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="64" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="64" x2="120" y2="64" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="82" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="82" x2="120" y2="82" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">ROTARY SWITCH</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">multi-position selector knob</text>
</svg>