<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Lead from bottom y=120 up to arrow header -->
  <line x1="60" y1="120" x2="60" y2="40" stroke="#000000" stroke-width="1.8"/>
  <!-- Upward Power Arrow -->
  <polygon points="60,25 45,45 75,45" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <text x="60" y="18" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">+VCC</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">VCC POWER RAIL</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">+3.3V / +5V positive supply</text>
</svg>