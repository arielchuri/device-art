<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Gate Lead from x=0 -->
  <line x1="0" y1="60" x2="42" y2="60" stroke="#000000" stroke-width="1.5"/>
  <line x1="42" y1="38" x2="42" y2="82" stroke="#000000" stroke-width="2"/>
  <!-- Broken Channel Plates -->
  <line x1="50" y1="38" x2="50" y2="48" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="55" x2="50" y2="65" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="72" x2="50" y2="82" stroke="#000000" stroke-width="2"/>
  <!-- Drain Lead to top y=0 -->
  <line x1="50" y1="43" x2="78" y2="43" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="43" x2="78" y2="0" stroke="#000000" stroke-width="1.5"/>
  <!-- Source Lead to bottom y=120 -->
  <line x1="50" y1="77" x2="78" y2="77" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="77" x2="78" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Substrate Lead with Inward Arrow -->
  <line x1="50" y1="60" x2="78" y2="60" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="60" x2="78" y2="77" stroke="#000000" stroke-width="1.5"/>
  <polygon points="50,60 62,55 62,65" fill="#000000"/>
  <text x="34" y="55" font-family="Andale Mono, monospace" font-size="7" fill="#888888">G</text>
  <text x="86" y="24" font-family="Andale Mono, monospace" font-size="7" fill="#888888">D</text>
  <text x="86" y="96" font-family="Andale Mono, monospace" font-size="7" fill="#888888">S</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">N-CH MOSFET</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">voltage-driven power switch</text>
</svg>