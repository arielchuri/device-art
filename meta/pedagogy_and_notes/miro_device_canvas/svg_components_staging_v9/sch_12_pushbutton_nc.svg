<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Left Lead to Terminal Contact Dot -->
  <line x1="0" y1="60" x2="40" y2="60" stroke="#000000" stroke-width="1.5"/>
  <circle cx="40" cy="60" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Right Lead to Terminal Contact Dot -->
  <circle cx="80" cy="60" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Bridging Contact Bar resting UNDER contacts -->
  <line x1="38" y1="62" x2="82" y2="62" stroke="#000000" stroke-width="2"/>
  <line x1="60" y1="62" x2="60" y2="30" stroke="#000000" stroke-width="1.5"/>
  <rect x="52" y="26" width="16" height="5" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PUSH BUTTON (NC)</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">normally-closed / breaks on press</text>
</svg>