<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <circle cx="60" cy="50" r="22" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Angry furrowed brow -->
  <line x1="48" y1="42" x2="56" y2="46" stroke="#000000" stroke-width="1.5"/>
  <line x1="72" y1="42" x2="64" y2="46" stroke="#000000" stroke-width="1.5"/>
  <circle cx="52" cy="48" r="2" fill="#000000"/>
  <circle cx="68" cy="48" r="2" fill="#000000"/>
  <!-- Zigzag annoyed mouth -->
  <polyline points="48,62 52,58 56,62 60,58 64,62 68,58 72,62" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">FRUSTRATED</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">unclear affordance / friction</text>
</svg>