<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">IO / PROTOCOL</text>


  <line x1="25" y1="36" x2="95" y2="36" stroke="#000000" stroke-width="1"/>
  <line x1="25" y1="46" x2="95" y2="46" stroke="#000000" stroke-width="1"/>
  <line x1="25" y1="56" x2="95" y2="56" stroke="#000000" stroke-width="1"/>
  <line x1="25" y1="66" x2="95" y2="66" stroke="#000000" stroke-width="1"/>
  <rect x="44" y="38" width="32" height="26" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="60" y="54" font-family="Andale Mono, monospace" font-size="8" fill="#000000" text-anchor="middle">SPI</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SPI BUS</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">MOSI / MISO / SCK / CS lines</text>
</svg>