<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">IO</text>


  <rect x="52" y="32" width="36" height="36" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="22" y1="50" x2="52" y2="50" stroke="#000000" stroke-width="1.5"/>
  <polygon points="52,50 44,45 44,55" fill="#000000"/>
  <text x="70" y="54" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DIN</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DIGITAL IN</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">binary HIGH / LOW pulse in</text>
</svg>