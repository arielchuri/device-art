<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <circle cx="60" cy="50" r="22" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Happy curved crescent eyes -->
  <path d="M 48 45 Q 52 40 56 45" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 64 45 Q 68 40 72 45" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Wide smiling mouth with hatching -->
  <path d="M 48 55 Q 60 70 72 55 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DELIGHTED</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">crisp tactile / aesthetic joy</text>
</svg>