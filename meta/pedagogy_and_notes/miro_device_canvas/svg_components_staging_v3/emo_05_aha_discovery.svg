<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <!-- Radiating lightbulb filament over head -->
  <circle cx="60" cy="42" r="12" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <line x1="60" y1="24" x2="60" y2="18" stroke="#000000" stroke-width="1"/>
  <line x1="74" y1="30" x2="78" y2="26" stroke="#000000" stroke-width="1"/>
  <line x1="46" y1="30" x2="42" y2="26" stroke="#000000" stroke-width="1"/>
  <rect x="54" y="54" width="12" height="6" fill="#000000"/>
  <line x1="56" y1="63" x2="64" y2="63" stroke="#888888" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">AHA! MOMENT</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">sudden mental model discovery</text>
</svg>