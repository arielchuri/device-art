<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">IO / PROTOCOL</text>


  <line x1="25" y1="42" x2="95" y2="42" stroke="#000000" stroke-width="1"/>
  <polygon points="95,42 87,38 87,46" fill="#000000"/>
  <line x1="95" y1="58" x2="25" y2="58" stroke="#000000" stroke-width="1"/>
  <polygon points="25,58 33,54 33,62" fill="#000000"/>
  <text x="60" y="36" font-family="Andale Mono, monospace" font-size="6.5" fill="#888888" text-anchor="middle">TX</text>
  <text x="60" y="68" font-family="Andale Mono, monospace" font-size="6.5" fill="#888888" text-anchor="middle">RX</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">UART SERIAL</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">TX / RX cross-coupled data</text>
</svg>