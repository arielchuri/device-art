<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <circle cx="60" cy="50" r="22" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Spiral dizzy eyes -->
  <path d="M 52 46 A 4 4 0 1 1 52 42" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 68 46 A 4 4 0 1 1 68 42" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Tangle wires above head -->
  <path d="M 46 26 Q 60 18 54 28 T 68 22" fill="none" stroke="#888888" stroke-width="0.8"/>
  <line x1="50" y1="60" x2="70" y2="60" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">OVERLOADED</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">sensory / information fatigue</text>
</svg>