      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <circle cx="60" cy="50" r="22" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="52" cy="46" r="2.5" fill="#000000"/>
  <circle cx="68" cy="46" r="2.5" fill="#000000"/>
  <!-- Wavy uncertain mouth line -->
