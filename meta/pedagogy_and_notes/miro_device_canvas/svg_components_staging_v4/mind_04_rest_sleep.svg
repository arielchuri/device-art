<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">STATE</text>


  <!-- Crescent moon & floating Zzz -->
  <path d="M 52 30 A 22 22 0 1 0 74 68 A 18 18 0 0 1 52 30 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <text x="80" y="36" font-family="Andale Mono, monospace" font-size="8" fill="#000000">Z</text>
  <text x="88" y="46" font-family="Andale Mono, monospace" font-size="6.5" fill="#888888">z</text>
  <text x="94" y="54" font-family="Andale Mono, monospace" font-size="5" fill="#888888">z</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">REST / SLEEP</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">circadian dormancy / Zzz</text>
</svg>