<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">THOUGHT</text>


  <!-- Mechanical chassis / chip box with expressive living face -->
  <rect x="36" y="30" width="48" height="42" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Expressive eyes -->
  <circle cx="48" cy="46" r="3.5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="49" cy="45" r="1.5" fill="#000000"/>
  <circle cx="72" cy="46" r="3.5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="73" cy="45" r="1.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M 52 58 Q 60 65 68 58" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">ANTHROPOMORPHISM</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">imbuing object with soul &amp; face</text>
</svg>