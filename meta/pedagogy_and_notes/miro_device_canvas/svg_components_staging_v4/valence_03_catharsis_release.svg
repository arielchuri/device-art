<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">VALENCE</text>


  <!-- Bursting pressure valve opening outwards -->
  <path d="M 45 65 Q 40 45 60 35 Q 80 45 75 65" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Upward venting steam/light rays -->
  <line x1="60" y1="35" x2="60" y2="20" stroke="#000000" stroke-width="1.5"/>
  <line x1="48" y1="38" x2="40" y2="26" stroke="#000000" stroke-width="1"/>
  <line x1="72" y1="38" x2="80" y2="26" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">CATHARSIS</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">emotional purging / relief</text>
</svg>