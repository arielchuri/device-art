<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">MINDFUL</text>


  <!-- Heavy anchor grounding into bedrock line -->
  <circle cx="60" cy="32" r="4" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="60" y1="36" x2="60" y2="64" stroke="#000000" stroke-width="1.5"/>
  <line x1="48" y1="44" x2="72" y2="44" stroke="#000000" stroke-width="1.5"/>
  <path d="M 42 54 Q 60 74 78 54" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="25" y1="70" x2="95" y2="70" stroke="#000000" stroke-width="1.5"/>
  <line x1="25" y1="74" x2="95" y2="74" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">GROUNDING</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">somatic sensory anchor</text>
</svg>