<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 120.00 79.78" width="120.00" height="79.78" xmlns="http://www.w3.org/2000/svg">
  <g id="oled-ssd1306">
    <!-- PCB Module (Blue PCB) -->
    <rect x="24" y="2" width="94" height="75.78" rx="4" fill="#2F7EB8" stroke="#1A496B" stroke-width="1.5"/>

    <!-- Corner Mounting Holes -->
    <circle cx="30" cy="8" r="2.5" fill="#FFFFFF" stroke="#1A496B" stroke-width="0.8"/>
    <circle cx="112" cy="8" r="2.5" fill="#FFFFFF" stroke="#1A496B" stroke-width="0.8"/>
    <circle cx="30" cy="71.78" r="2.5" fill="#FFFFFF" stroke="#1A496B" stroke-width="0.8"/>
    <circle cx="112" cy="71.78" r="2.5" fill="#FFFFFF" stroke="#1A496B" stroke-width="0.8"/>

    <!-- OLED Glass Screen (Dark Blue/Black Screen) -->
    <rect x="42" y="12" width="64" height="55.78" rx="2" fill="#111827" stroke="#374151" stroke-width="1.2"/>
    <!-- Simulated Active OLED Graphics / Text -->
    <rect x="46" y="16" width="56" height="47.78" fill="#1F2937"/>
    <text x="74" y="37.89" font-family="'Andale Mono', monospace" font-size="8px" font-weight="bold" fill="#38BDF8" text-anchor="middle">128x64 OLED</text>
    <text x="74" y="47.89" font-family="'Andale Mono', monospace" font-size="6.5px" fill="#A7F3D0" text-anchor="middle">SSD1306 I2C</text>

    <!-- 4 Header Pins on Left Edge (GND, VCC, SCL, SDA) -->
    <!-- Pin 1: GND -->
    <line x1="24" y1="12.0" x2="4" y2="12.0" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="12.00" r="2.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <circle cx="4" cy="12.00" r="0.8" fill="#000000"/>

    <!-- Pin 2: VCC -->
    <line x1="24" y1="30.593" x2="4" y2="30.593" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="30.59" r="2.5" fill="#FFFFFF" stroke="#D40000" stroke-width="1"/>
    <circle cx="4" cy="30.59" r="0.8" fill="#D40000"/>

    <!-- Pin 3: SCL -->
    <line x1="24" y1="49.186" x2="4" y2="49.186" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="49.19" r="2.5" fill="#FFFFFF" stroke="#2F7EB8" stroke-width="1"/>
    <circle cx="4" cy="49.19" r="0.8" fill="#2F7EB8"/>

    <!-- Pin 4: SDA -->
    <line x1="24" y1="67.779" x2="4" y2="67.779" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="67.78" r="2.5" fill="#FFFFFF" stroke="#2F7EB8" stroke-width="1"/>
    <circle cx="4" cy="67.78" r="0.8" fill="#2F7EB8"/>
  </g>
</svg>