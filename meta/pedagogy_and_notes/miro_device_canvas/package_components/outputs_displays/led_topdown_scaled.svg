<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 34.00 34.00" width="34.00" height="34.00" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="led-glow-red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF7A85"/>
      <stop offset="60%" stop-color="#E60012"/>
      <stop offset="100%" stop-color="#9E000D"/>
    </radialGradient>
  </defs>

  <g id="led-topdown">
    <!-- LED Outer Flange / Rim with Flat Edge at Bottom (Cathode) -->
    <path d="M 2.50 26.00
             A 15.0 15.0 0 1 1 31.50 26.00
             Z"
          fill="url(#led-glow-red)"
          stroke="#7A000A"
          stroke-width="1.2"/>

    <!-- Inner Lens Dome Ring -->
    <circle cx="17.0" cy="16.0" r="10" fill="none" stroke="#FFA3AC" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- Anode (+) Lead Terminal (Top) -->
    <circle cx="17.0" cy="7.70" r="2.8" fill="#FFFFFF" stroke="#D40000" stroke-width="1"/>
    <circle cx="17.0" cy="7.70" r="1" fill="#D40000"/>

    <!-- Cathode (-) Lead Terminal (Bottom / Flat side) -->
    <circle cx="17.0" cy="26.30" r="2.8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <circle cx="17.0" cy="26.30" r="1" fill="#000000"/>

    <!-- Specular Highlight -->
    <ellipse cx="13.0" cy="12.0" rx="3.5" ry="2" transform="rotate(-30 13.0 12.0)" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>
</svg>