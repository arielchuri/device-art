<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 26.00 68.00" width="26.00" height="68.00" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="led-side-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B78"/>
      <stop offset="35%" stop-color="#E60012"/>
      <stop offset="85%" stop-color="#A8000E"/>
      <stop offset="100%" stop-color="#730009"/>
    </linearGradient>
  </defs>

  <g id="led-sideview">
    <!-- Longer Anode Lead (+) on Left (spaced 18.59px = 1 row) -->
    <line x1="3.70" y1="29.0" x2="3.70" y2="66.0" stroke="#8E99A2" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Shorter Cathode Lead (-) on Right -->
    <line x1="22.30" y1="29.0" x2="22.30" y2="58.0" stroke="#8E99A2" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Internal Anode / Cathode Structure -->
    <path d="M 3.70 26.0 L 3.70 14.0 L 11.0 14.0" stroke="#D1D8E0" stroke-width="1.2" fill="none"/>
    <path d="M 22.30 26.0 L 22.30 16.0 L 12.0 12.0 L 22.30 9.0 Z" fill="#D1D8E0" stroke="#B0B9C2" stroke-width="0.8"/>

    <!-- LED Epoxy Dome -->
    <path d="M 3.00 26.0
             L 3.00 12.0
             A 10.0 10.0 0 0 1 23.00 12.0
             L 23.00 26.0
             Z"
          fill="url(#led-side-grad)"
          stroke="#7A000A"
          stroke-width="1"
          fill-opacity="0.9"/>

    <!-- Bottom Flange / Rim Ring (Flat right edge) -->
    <path d="M 1.00 26.0
             L 24.00 26.0
             L 24.00 29.0
             L 1.00 29.0
             Z"
          fill="#B80010"
          stroke="#7A000A"
          stroke-width="1"/>

    <!-- Specular Highlight -->
    <path d="M 6.00 24.0 L 6.00 10.0 Q 6.0 5.0 11.0 5.0" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
</svg>