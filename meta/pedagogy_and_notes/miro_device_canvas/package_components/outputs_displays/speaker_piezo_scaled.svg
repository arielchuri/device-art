<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 40.00 47.19" width="40.00" height="47.19" xmlns="http://www.w3.org/2000/svg">
  <g id="piezo-speaker-topdown">
    <!-- Black Plastic Cylindrical Housing -->
    <circle cx="22.0" cy="23.593" r="15" fill="#333333" stroke="#000000" stroke-width="1.2"/>
    <!-- Sound Port Hole -->
    <circle cx="22.0" cy="23.593" r="5" fill="#111827"/>
    <!-- Brass Disc Rim Accent -->
    <circle cx="22.0" cy="23.593" r="12" fill="none" stroke="#D4AF37" stroke-width="0.6"/>

    <!-- 2 Pins (Positive +, Negative -) -->
    <line x1="22.0" y1="5.0" x2="4" y2="5.0" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="5.00" r="2.5" fill="#FFFFFF" stroke="#D40000" stroke-width="1"/>
    <circle cx="4" cy="5.00" r="0.8" fill="#D40000"/>

    <line x1="22.0" y1="42.186" x2="4" y2="42.186" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="42.19" r="2.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <circle cx="4" cy="42.19" r="0.8" fill="#000000"/>
  </g>
</svg>