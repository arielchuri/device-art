<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 110.00 83.78" width="110.00" height="83.78" xmlns="http://www.w3.org/2000/svg">
  <g id="hcsr04-ultrasonic">
    <!-- Blue PCB Module -->
    <rect x="22" y="2" width="86" height="79.78" rx="4" fill="#2F7EB8" stroke="#1A496B" stroke-width="1.5"/>

    <!-- 2 Metallic Transducer Barrels (Emitter T & Receiver R) -->
    <!-- Emitter T -->
    <circle cx="48" cy="41.89" r="16" fill="#D1D8E0" stroke="#606F7B" stroke-width="1.2"/>
    <circle cx="48" cy="41.89" r="12" fill="#333333"/>
    <text x="48" y="43.89" font-family="'Andale Mono', monospace" font-size="7px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text>

    <!-- Receiver R -->
    <circle cx="84" cy="41.89" r="16" fill="#D1D8E0" stroke="#606F7B" stroke-width="1.2"/>
    <circle cx="84" cy="41.89" r="12" fill="#333333"/>
    <text x="84" y="43.89" font-family="'Andale Mono', monospace" font-size="7px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text>

    <!-- 4 Header Pins (VCC, Trig, Echo, GND) -->
    <!-- Pin 1: VCC -->
    <line x1="22" y1="14.0" x2="4" y2="14.0" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="14.00" r="2.5" fill="#FFFFFF" stroke="#D40000" stroke-width="1"/>
    <circle cx="4" cy="14.00" r="0.8" fill="#D40000"/>

    <!-- Pin 2: Trig -->
    <line x1="22" y1="32.593" x2="4" y2="32.593" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="32.59" r="2.5" fill="#FFFFFF" stroke="#2F7EB8" stroke-width="1"/>
    <circle cx="4" cy="32.59" r="0.8" fill="#2F7EB8"/>

    <!-- Pin 3: Echo -->
    <line x1="22" y1="51.186" x2="4" y2="51.186" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="51.19" r="2.5" fill="#FFFFFF" stroke="#2F7EB8" stroke-width="1"/>
    <circle cx="4" cy="51.19" r="0.8" fill="#2F7EB8"/>

    <!-- Pin 4: GND -->
    <line x1="22" y1="69.779" x2="4" y2="69.779" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="69.78" r="2.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <circle cx="4" cy="69.78" r="0.8" fill="#000000"/>
  </g>
</svg>