<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 40.00 45.19" width="40.00" height="45.19" xmlns="http://www.w3.org/2000/svg">
  <g id="potentiometer-topdown">
    <!-- Main Rotary Base (Cylindrical body) -->
    <circle cx="24.0" cy="22.59" r="15" fill="#2F7EB8" stroke="#1A496B" stroke-width="1.2"/>
    <!-- Shaft Outer Ring -->
    <circle cx="24.0" cy="22.59" r="8" fill="#D1D8E0" stroke="#000000" stroke-width="1"/>
    <!-- Shaft Center Notch / Flat D-shaft -->
    <path d="M 19.0 19.593 L 29.0 19.593 A 5 5 0 0 1 19.0 19.593 Z" fill="#606F7B"/>
    <!-- Rotary Dial Indicator Notch -->
    <line x1="24.0" y1="22.593" x2="31.0" y2="22.593" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 3 Terminal Pins (Pin 1: VCC/GND, Pin 2: Wiper Output, Pin 3: GND/VCC) -->
    <!-- Pin 1 -->
    <line x1="24.0" y1="4.0" x2="4" y2="4.0" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="4.00" r="2.5" fill="#FFFFFF" stroke="#D40000" stroke-width="1"/>
    <circle cx="4" cy="4.00" r="0.8" fill="#D40000"/>

    <!-- Pin 2 (Wiper) -->
    <line x1="24.0" y1="22.593" x2="4" y2="22.593" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="22.59" r="2.5" fill="#FFFFFF" stroke="#2F7EB8" stroke-width="1"/>
    <circle cx="4" cy="22.59" r="0.8" fill="#2F7EB8"/>

    <!-- Pin 3 -->
    <line x1="24.0" y1="41.186" x2="4" y2="41.186" stroke="#8E99A2" stroke-width="1.8"/>
    <circle cx="4" cy="41.19" r="2.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <circle cx="4" cy="41.19" r="0.8" fill="#000000"/>
  </g>
</svg>