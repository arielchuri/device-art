<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 48.00 43.19" width="48.00" height="43.19" xmlns="http://www.w3.org/2000/svg">
  <g id="pushbutton-topdown">
    <!-- Metallic/Black Square Base (6x6mm body) -->
    <rect x="9.00" y="6.59" width="30" height="30" rx="3" fill="#333333" stroke="#000000" stroke-width="1.2"/>
    <!-- Metallic Top Plate Ring -->
    <circle cx="24.0" cy="21.593" r="11" fill="#D1D8E0" stroke="#606F7B" stroke-width="0.8"/>
    <!-- Round Plunger Button Center -->
    <circle cx="24.0" cy="21.593" r="8" fill="#D40000" stroke="#900000" stroke-width="1"/>

    <!-- 4 Gull-wing / DIP Pins (2 Left, 2 Right) -->
    <!-- Left Top Pin -->
    <line x1="9.0" y1="12.2965" x2="3" y2="12.2965" stroke="#8E99A2" stroke-width="2"/>
    <circle cx="3" cy="12.30" r="2" fill="#606F7B"/>

    <!-- Left Bottom Pin -->
    <line x1="9.0" y1="30.889499999999998" x2="3" y2="30.889499999999998" stroke="#8E99A2" stroke-width="2"/>
    <circle cx="3" cy="30.89" r="2" fill="#606F7B"/>

    <!-- Right Top Pin -->
    <line x1="39.0" y1="12.2965" x2="45.0" y2="12.2965" stroke="#8E99A2" stroke-width="2"/>
    <circle cx="45.0" cy="12.30" r="2" fill="#606F7B"/>

    <!-- Right Bottom Pin -->
    <line x1="39.0" y1="30.889499999999998" x2="45.0" y2="30.889499999999998" stroke="#8E99A2" stroke-width="2"/>
    <circle cx="45.0" cy="30.89" r="2" fill="#606F7B"/>
  </g>
</svg>