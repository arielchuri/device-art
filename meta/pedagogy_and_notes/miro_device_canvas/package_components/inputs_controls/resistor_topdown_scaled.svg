<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 20.00 82.37" width="20.00" height="82.37" xmlns="http://www.w3.org/2000/svg">
  <g id="resistor-topdown">
    <!-- Wire Lead -->
    <line x1="10.0" y1="4.0" x2="10.0" y2="78.372" stroke="#8E99A2" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Pin Contact Rings (Top & Bottom) -->
    <circle cx="10.0" cy="4.0" r="3" fill="#606F7B" stroke="#000000" stroke-width="0.8"/>
    <circle cx="10.0" cy="4.0" r="1" fill="#FFFFFF"/>
    <circle cx="10.0" cy="78.372" r="3" fill="#606F7B" stroke="#000000" stroke-width="0.8"/>
    <circle cx="10.0" cy="78.372" r="1" fill="#FFFFFF"/>

    <!-- Resistor Body (Tan ceramic) -->
    <rect x="3.00" y="23.19" width="14.0" height="36.0" rx="4" ry="4" fill="#E6D3B3" stroke="#5A4A32" stroke-width="1.2"/>
    
    <!-- 4 Color Bands (220 Ohm: Red, Red, Brown, Gold) -->
    <rect x="3.00" y="29.19" width="14.0" height="3.5" fill="#D40000"/>
    <rect x="3.00" y="36.19" width="14.0" height="3.5" fill="#D40000"/>
    <rect x="3.00" y="43.19" width="14.0" height="3.5" fill="#7B3F00"/>
    <rect x="3.00" y="50.19" width="14.0" height="3.5" fill="#D4AF37"/>
  </g>
</svg>