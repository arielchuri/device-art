<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Lead In from left edge x=0, y=60 -->
  <line x1="0" y1="60" x2="30" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Standard IEEE 6-peak zig-zag -->
  <polyline points="30,60 35,45 45,75 55,45 65,75 75,45 85,75 90,60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Lead Out to right edge x=120, y=60 -->
  <line x1="90" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">RESISTOR (R)</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">limits current flow (Ohms)</text>
</svg>