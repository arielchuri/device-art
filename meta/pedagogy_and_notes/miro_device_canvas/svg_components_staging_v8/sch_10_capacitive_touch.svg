<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Left Sensing Lead -->
  <line x1="0" y1="60" x2="35" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Interdigital Capacitive Comb Grid -->
  <line x1="35" y1="40" x2="35" y2="80" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="45" x2="75" y2="45" stroke="#000000" stroke-width="1.5"/>
  <line x1="35" y1="60" x2="75" y2="60" stroke="#000000" stroke-width="1.5"/>
  <line x1="35" y1="75" x2="75" y2="75" stroke="#000000" stroke-width="1.5"/>
  <!-- Opposing Comb Plate reaching right edge x=120 -->
  <line x1="85" y1="40" x2="85" y2="80" stroke="#000000" stroke-width="2"/>
  <line x1="85" y1="52" x2="45" y2="52" stroke="#000000" stroke-width="1.5"/>
  <line x1="85" y1="68" x2="45" y2="68" stroke="#000000" stroke-width="1.5"/>
  <line x1="85" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">CAP TOUCH PAD</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">capacitive proximity touch electrode</text>
</svg>