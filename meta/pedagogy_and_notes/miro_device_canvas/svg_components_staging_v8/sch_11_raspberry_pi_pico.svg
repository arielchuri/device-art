<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Main Green PCB Body -->
  <rect x="25" y="15" width="70" height="72" rx="4" fill="url(#hatch)" stroke="#000000" stroke-width="1.2"/>
  <!-- Top Micro-USB Port extending to top edge -->
  <rect x="46" y="8" width="28" height="12" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <!-- Left Side Pin Header Leads reaching x=0 edge -->
  <line x1="0" y1="28" x2="25" y2="28" stroke="#000000" stroke-width="1.5"/>
  <line x1="0" y1="42" x2="25" y2="42" stroke="#000000" stroke-width="1.5"/>
  <line x1="0" y1="56" x2="25" y2="56" stroke="#000000" stroke-width="1.5"/>
  <line x1="0" y1="70" x2="25" y2="70" stroke="#000000" stroke-width="1.5"/>
  <!-- Right Side Pin Header Leads reaching x=120 edge -->
  <line x1="95" y1="28" x2="120" y2="28" stroke="#000000" stroke-width="1.5"/>
  <line x1="95" y1="42" x2="120" y2="42" stroke="#000000" stroke-width="1.5"/>
  <line x1="95" y1="56" x2="120" y2="56" stroke="#000000" stroke-width="1.5"/>
  <line x1="95" y1="70" x2="120" y2="70" stroke="#000000" stroke-width="1.5"/>
  <!-- RP2040 Silicon Core -->
  <rect x="48" y="38" width="24" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="60" y="52" font-family="Andale Mono, monospace" font-size="6" fill="#000000" text-anchor="middle">RP2040</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">RP2040 PICO</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">Raspberry Pi Pico pinout header</text>
</svg>