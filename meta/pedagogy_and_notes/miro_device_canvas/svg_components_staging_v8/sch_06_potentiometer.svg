<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- End Pin 1 (Left Lead) -->
  <line x1="0" y1="60" x2="30" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Zig-zag track -->
  <polyline points="30,60 35,48 45,72 55,48 65,72 75,48 85,72 90,60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- End Pin 3 (Right Lead) -->
  <line x1="90" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Center Wiper (Pin 2) extending up to top edge y=0 -->
  <line x1="60" y1="0" x2="60" y2="46" stroke="#000000" stroke-width="1.5"/>
  <polygon points="60,46 55,38 65,38" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">POTENTIOMETER</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">variable resistor voltage divider</text>
</svg>