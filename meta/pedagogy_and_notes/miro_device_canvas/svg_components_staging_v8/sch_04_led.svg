<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Left Lead (Anode) -->
  <line x1="0" y1="60" x2="45" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Diode Triangle pointing right -->
  <polygon points="45,42 70,60 45,78" fill="url(#hatch)" stroke="#000000" stroke-width="1.2"/>
  <!-- Cathode Bar -->
  <line x1="70" y1="42" x2="70" y2="78" stroke="#000000" stroke-width="2"/>
  <!-- Right Lead (Cathode) -->
  <line x1="70" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Radiating Photon Rays -->
  <line x1="60" y1="38" x2="72" y2="24" stroke="#000000" stroke-width="1.2"/>
  <polygon points="72,24 64,26 68,30" fill="#000000"/>
  <line x1="70" y1="44" x2="82" y2="30" stroke="#000000" stroke-width="1.2"/>
  <polygon points="82,30 74,32 78,36" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">LED (DIODE)</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">light emitting semiconductor</text>
</svg>