<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Left Anode Lead -->
  <line x1="0" y1="60" x2="52" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Flat Anode Plate -->
  <line x1="52" y1="36" x2="52" y2="84" stroke="#000000" stroke-width="2"/>
  <!-- Plus symbol -->
  <text x="42" y="44" font-family="Andale Mono, monospace" font-size="9" fill="#000000">+</text>
  <!-- Curved Cathode Plate -->
  <path d="M 68 36 A 35 35 0 0 0 68 84" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Right Cathode Lead -->
  <line x1="72" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">POLARIZED CAP</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">electrolytic with +/- polarity</text>
</svg>