<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Resistor track -->
  <line x1="0" y1="60" x2="30" y2="60" stroke="#000000" stroke-width="1.5"/>
  <polyline points="30,60 35,48 45,72 55,48 65,72 75,48 85,72 90,60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="90" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Enclosing sensor circle -->
  <circle cx="60" cy="60" r="26" fill="none" stroke="#888888" stroke-width="0.8"/>
  <!-- Inward incoming photon light rays -->
  <line x1="30" y1="20" x2="44" y2="34" stroke="#000000" stroke-width="1.2"/>
  <polygon points="44,34 36,32 40,28" fill="#000000"/>
  <line x1="42" y1="16" x2="56" y2="30" stroke="#000000" stroke-width="1.2"/>
  <polygon points="56,30 48,28 52,24" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PHOTO-RESISTOR</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">light dependent resistor (LDR)</text>
</svg>