<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Left Positive Lead -->
  <line x1="0" y1="60" x2="48" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Long Anode Plate (+) -->
  <line x1="48" y1="32" x2="48" y2="88" stroke="#000000" stroke-width="2"/>
  <text x="38" y="44" font-family="Andale Mono, monospace" font-size="9" fill="#000000">+</text>
  <!-- Short Thick Cathode Plate (-) -->
  <line x1="62" y1="42" x2="62" y2="78" stroke="#000000" stroke-width="4"/>
  <text x="74" y="44" font-family="Andale Mono, monospace" font-size="9" fill="#888888">-</text>
  <!-- Right Negative Lead -->
  <line x1="62" y1="60" x2="120" y2="60" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DC POWER SOURCE</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">VCC battery / DC supply (+/-)</text>
</svg>