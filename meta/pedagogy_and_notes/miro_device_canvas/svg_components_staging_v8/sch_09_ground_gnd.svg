<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular schematic grid snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Top Lead extending from y=0 edge downward to y=45 -->
  <line x1="60" y1="0" x2="60" y2="45" stroke="#000000" stroke-width="1.8"/>
  <!-- 3 Stepped Ground Bars -->
  <line x1="32" y1="45" x2="88" y2="45" stroke="#000000" stroke-width="2"/>
  <line x1="42" y1="55" x2="78" y2="55" stroke="#000000" stroke-width="1.8"/>
  <line x1="52" y1="65" x2="68" y2="65" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="98" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">GROUND (GND)</text>
  <text x="60" y="110" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">0V common earth baseline</text>
</svg>