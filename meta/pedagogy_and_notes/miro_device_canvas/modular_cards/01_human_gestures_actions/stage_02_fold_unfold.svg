<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PHYSICAL</text>


  <!-- Base plane -->
  <line x1="50" y1="105" x2="110" y2="105" stroke="#000000" stroke-width="1.5"/>
  <!-- Folding plane pivoting around vertex (110, 105) -->
  <line x1="110" y1="105" x2="150" y2="60" stroke="#000000" stroke-width="1.5"/>
  <circle cx="110" cy="105" r="4" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <!-- Hinge sweep arc -->
  <path d="M 80 105 A 30 30 0 0 1 125 75" fill="none" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">FOLD / UNFOLD</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">opens / closes clamshell hinge</text>
</svg>