<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="200" height="200" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="200"/>
    </pattern>
  </defs>
  <g transform="scale(1.6666667)">

  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="200" height="200" fill="none" stroke="#888888" stroke-width="200" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">VERB</text>


  <rect x="42" y="55" width="200" height="200" fill="none" stroke="#000000" stroke-width="200"/>
  <!-- Upward release arrow -->
  <line x1="60" y1="50" x2="60" y2="30" stroke="#000000" stroke-width="200"/>
  <polyline points="56,35 60,30 64,35" fill="none" stroke="#000000" stroke-width="200"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">RELEASE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">lift contact / spring up</text>

  </g>
</svg>