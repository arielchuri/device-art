<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <rect x="55" y="45" width="90" height="80" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Touch contact point -->
  <circle cx="100" cy="85" r="5" fill="#000000"/>
  <!-- Touch ripple waves -->
  <circle cx="100" cy="85" r="14" fill="none" stroke="#888888" stroke-width="0.5"/>
  <circle cx="100" cy="85" r="24" fill="none" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">TOUCH GESTURE</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">tap, swipe, or pinch</text>
</svg>