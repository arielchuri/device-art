<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PHYSICAL</text>


  <!-- Device chassis with slot cut -->
  <rect x="50" y="75" width="100" height="45" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="70" y1="75" x2="130" y2="75" stroke="#ffffff" stroke-width="2"/>
  <rect x="70" y="73" width="60" height="4" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Card inserting from above -->
  <rect x="80" y="45" width="40" height="30" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="100" y1="35" x2="100" y2="48" stroke="#000000" stroke-width="1"/>
  <polyline points="96,43 100,48 104,43" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">INSERT / SLAT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">drops item into device slot</text>
</svg>