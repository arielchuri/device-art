<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PHYSICAL</text>


  <!-- Two rectangular states with 180-deg flip arrow -->
  <rect x="75" y="45" width="50" height="35" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="75" y="90" width="50" height="35" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Circular flip tumble arrow -->
  <path d="M 135 60 A 25 25 0 0 1 135 110" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="135,110 128,102 142,102" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <path d="M 65 110 A 25 25 0 0 1 65 60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="65,60 72,68 58,68" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">FLIP / INVERT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">turns device upside down</text>
</svg>