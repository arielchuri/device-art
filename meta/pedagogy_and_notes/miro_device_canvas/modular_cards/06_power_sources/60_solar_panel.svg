<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">POWER</text>


  <!-- Tilted solar array cell grid -->
  <polygon points="50,105 70,55 150,55 130,105" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="90" y1="55" x2="70" y2="105" stroke="#000000" stroke-width="0.5"/>
  <line x1="130" y1="55" x2="110" y2="105" stroke="#000000" stroke-width="0.5"/>
  <line x1="60" y1="80" x2="140" y2="80" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">SOLAR PANEL</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">harvests ambient light power</text>
</svg>