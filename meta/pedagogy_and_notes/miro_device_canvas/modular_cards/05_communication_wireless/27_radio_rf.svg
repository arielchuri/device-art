<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">CONNECT</text>


  <!-- Antenna tower -->
  <line x1="100" y1="65" x2="100" y2="125" stroke="#000000" stroke-width="1.5"/>
  <polygon points="85,125 115,125 100,105" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="65" r="4" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- RF wave rings -->
  <path d="M 80 65 A 20 20 0 0 1 80 45" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 120 65 A 20 20 0 0 0 120 45" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 68 65 A 32 32 0 0 1 68 35" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 132 65 A 32 32 0 0 0 132 35" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">RADIO (RF)</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">long-range broadcast radio</text>
</svg>