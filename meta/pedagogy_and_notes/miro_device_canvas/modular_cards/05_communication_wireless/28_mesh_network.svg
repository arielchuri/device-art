<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">CONNECT</text>


  <!-- Interconnected nodes -->
  <circle cx="65" cy="60" r="6" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <circle cx="135" cy="60" r="6" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="85" r="8" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <circle cx="65" cy="115" r="6" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <circle cx="135" cy="115" r="6" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <!-- Interconnecting mesh lines -->
  <line x1="65" y1="60" x2="135" y2="60" stroke="#000000" stroke-width="0.5"/>
  <line x1="65" y1="60" x2="100" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="135" y1="60" x2="100" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="65" y1="115" x2="100" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="135" y1="115" x2="100" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="65" y1="115" x2="135" y2="115" stroke="#000000" stroke-width="0.5"/>
  <line x1="65" y1="60" x2="65" y2="115" stroke="#000000" stroke-width="0.5"/>
  <line x1="135" y1="60" x2="135" y2="115" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">MESH NETWORK</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">device-to-device node grid</text>
</svg>