<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">LOGIC</text>


  <!-- Padlock body -->
  <rect x="75" y="75" width="50" height="40" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="100" cy="92" r="3" fill="url(#hatch)"/>
  <line x1="100" y1="95" x2="100" y2="103" stroke="#000000" stroke-width="1.5"/>
  <!-- Padlock shackle loop -->
  <path d="M 85 75 L 85 62 A 15 15 0 0 1 115 62 L 115 75" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">LOCK / RESTRICT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">action gated until unlocked</text>
</svg>