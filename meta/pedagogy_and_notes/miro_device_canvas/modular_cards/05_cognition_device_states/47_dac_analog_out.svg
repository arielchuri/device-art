<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">LOGIC</text>


  <!-- Digital stepped wave converting to smooth analog curve -->
  <polyline points="45,95 65,95 65,70 85,70 85,95 95,95" fill="none" stroke="#888888" stroke-width="1"/>
  <line x1="95" y1="85" x2="110" y2="85" stroke="#000000" stroke-width="1"/>
  <polygon points="110,85 102,80 102,90" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <path d="M 115 85 Q 130 60 145 85 T 175 85" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">DAC CONVERTER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">digital to analog voltage</text>
</svg>