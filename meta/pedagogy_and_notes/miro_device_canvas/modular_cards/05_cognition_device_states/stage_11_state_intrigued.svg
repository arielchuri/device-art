<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">EMOTION</text>


  <circle cx="100" cy="85" r="32" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Focused tilted gaze -->
  <ellipse cx="88" cy="78" rx="4" ry="6" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="89" cy="77" r="2" fill="url(#hatch)"/>
  <ellipse cx="112" cy="78" rx="4" ry="6" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="113" cy="77" r="2" fill="url(#hatch)"/>
  <!-- Subtle wry half-smile -->
  <path d="M 92 98 Q 105 102 112 96" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">INTRIGUED / CURIOUS</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">drawn in / investigating</text>
</svg>