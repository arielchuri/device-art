<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">LOGIC</text>


  <!-- Chasing circular arrows -->
  <path d="M 75 85 A 25 25 0 1 1 125 85" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polyline points="120,78 125,85 118,88" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 125 85 A 25 25 0 1 1 75 85" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polyline points="80,92 75,85 82,82" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">LOOP / REPEAT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">continuous cycle sequence</text>
</svg>