<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">LOGIC</text>


  <!-- Flowchart diamond node -->
  <polygon points="100,55 130,85 100,115 70,85" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Diverging branch arrows -->
  <line x1="130" y1="85" x2="155" y2="85" stroke="#000000" stroke-width="1"/>
  <polyline points="150,80 155,85 150,90" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="100" y1="115" x2="100" y2="135" stroke="#000000" stroke-width="1"/>
  <polyline points="95,130 100,135 105,130" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">DECISION / FORK</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">IF / THEN condition branch</text>
</svg>