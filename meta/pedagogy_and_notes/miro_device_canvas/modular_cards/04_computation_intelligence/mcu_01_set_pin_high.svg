<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">MCU ACTION</text>


  <!-- Step up waveform to 3.3V baseline -->
  <line x1="25" y1="62" x2="50" y2="62" stroke="#888888" stroke-width="1"/>
  <line x1="50" y1="62" x2="50" y2="35" stroke="#000000" stroke-width="1.5"/>
  <line x1="50" y1="35" x2="95" y2="35" stroke="#000000" stroke-width="1.5"/>
  <!-- UP arrow indicator -->
  <polyline points="46,42 50,35 54,42" fill="none" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="52" font-family="Andale Mono, monospace" font-size="8" fill="#000000">3.3V</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SET PIN HIGH</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">GPIO 3.3V / logic 1 (HIGH)</text>
</svg>