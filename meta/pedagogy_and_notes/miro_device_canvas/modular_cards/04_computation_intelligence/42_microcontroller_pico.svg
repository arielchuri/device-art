<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">LOGIC</text>


  <!-- Simplified top view PCB with edge pin castellations -->
  <rect x="65" y="45" width="70" height="85" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Main MCU chip in center with hatching -->
  <rect x="80" y="65" width="40" height="40" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Left pins -->
  <line x1="55" y1="55" x2="65" y2="55" stroke="#888888" stroke-width="1"/>
  <line x1="55" y1="70" x2="65" y2="70" stroke="#888888" stroke-width="1"/>
  <line x1="55" y1="85" x2="65" y2="85" stroke="#888888" stroke-width="1"/>
  <line x1="55" y1="100" x2="65" y2="100" stroke="#888888" stroke-width="1"/>
  <line x1="55" y1="115" x2="65" y2="115" stroke="#888888" stroke-width="1"/>
  <!-- Right pins -->
  <line x1="135" y1="55" x2="145" y2="55" stroke="#888888" stroke-width="1"/>
  <line x1="135" y1="70" x2="145" y2="70" stroke="#888888" stroke-width="1"/>
  <line x1="135" y1="85" x2="145" y2="85" stroke="#888888" stroke-width="1"/>
  <line x1="135" y1="100" x2="145" y2="100" stroke="#888888" stroke-width="1"/>
  <line x1="135" y1="115" x2="145" y2="115" stroke="#888888" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">MICROCONTROLLER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">Pico / ESP32 logic brain</text>
</svg>