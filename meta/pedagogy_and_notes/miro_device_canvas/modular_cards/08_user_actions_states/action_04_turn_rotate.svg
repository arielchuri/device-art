<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">ACTION</text>


  <circle cx="100" cy="85" r="20" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Two rotational sweep arrows -->
  <path d="M 68 85 A 32 32 0 0 1 126 62" fill="none" stroke="#000000" stroke-width="1"/>
  <polyline points="120,58 126,62 128,54" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 132 85 A 32 32 0 0 1 74 108" fill="none" stroke="#000000" stroke-width="1"/>
  <polyline points="80,112 74,108 72,116" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">TURN / ROTATE</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">twists dial or knob</text>
</svg>