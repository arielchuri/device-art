<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PHYSICAL</text>


  <!-- Soft body oval -->
  <ellipse cx="100" cy="85" rx="35" ry="25" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Inward inward compression arrows -->
  <line x1="45" y1="85" x2="60" y2="85" stroke="#000000" stroke-width="1.5"/>
  <polygon points="60,85 52,80 52,90" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="155" y1="85" x2="140" y2="85" stroke="#000000" stroke-width="1.5"/>
  <polygon points="140,85 148,80 148,90" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">SQUEEZE / COMPRESS</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">pinches / compresses soft body</text>
</svg>