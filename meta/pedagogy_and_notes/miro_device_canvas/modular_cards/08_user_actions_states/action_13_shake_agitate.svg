<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">ACTION</text>


  <rect x="75" y="60" width="50" height="50" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Shake bracket arrows on both sides -->
  <path d="M 55 65 Q 45 85 55 105" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 45 60 Q 35 85 45 110" fill="none" stroke="#888888" stroke-width="0.5"/>
  <path d="M 145 65 Q 155 85 145 105" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 155 60 Q 165 85 155 110" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">SHAKE / AGITATE</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">vigorously shakes device</text>
</svg>