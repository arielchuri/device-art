<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PORT</text>


  <!-- Narrower Mini-HDMI stepped socket -->
  <polygon points="65,72 135,72 135,86 128,96 72,96 65,86" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="73,78 127,78 127,84 122,91 78,91 73,84" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>

  <!-- Small "mHD" badge at top right -->
  <rect x="140" y="32" width="26" height="16" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="153" y="44" font-family="Andale Mono, monospace" font-size="7.5" fill="#000000" text-anchor="middle">mHD</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">MINI-HDMI PORT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">Type-C compact digital video</text>
</svg>