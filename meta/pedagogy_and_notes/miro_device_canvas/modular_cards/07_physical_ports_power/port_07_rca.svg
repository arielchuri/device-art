<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PORT</text>


  <!-- Concentric cylindrical RCA female jack -->
  <circle cx="100" cy="85" r="32" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="100" cy="85" r="22" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Center positive pin receptacle -->
  <circle cx="100" cy="85" r="7" fill="#000000"/>
  <!-- 4 outer shield ground notches -->
  <line x1="100" y1="53" x2="100" y2="63" stroke="#ffffff" stroke-width="2"/>
  <line x1="100" y1="107" x2="100" y2="117" stroke="#ffffff" stroke-width="2"/>
  <line x1="68" y1="85" x2="78" y2="85" stroke="#ffffff" stroke-width="2"/>
  <line x1="122" y1="85" x2="132" y2="85" stroke="#ffffff" stroke-width="2"/>

  <!-- Small audio waveform icon at top right -->
  <path d="M 142 45 Q 147 35 152 45 T 162 45" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">RCA JACK</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">analog composite audio/video</text>
</svg>