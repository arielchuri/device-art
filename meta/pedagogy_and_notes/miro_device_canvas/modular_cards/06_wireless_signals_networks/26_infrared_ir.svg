<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">CONNECT</text>


  <rect x="45" y="65" width="30" height="40" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Radiating light rays / pulses -->
  <line x1="85" y1="85" x2="155" y2="85" stroke="#000000" stroke-width="1.5"/>
  <polygon points="155,85 145,80 145,90" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="90" y1="70" x2="135" y2="55" stroke="#888888" stroke-width="0.5"/>
  <line x1="90" y1="100" x2="135" y2="115" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">INFRARED (IR)</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">line-of-sight optical beam</text>
</svg>