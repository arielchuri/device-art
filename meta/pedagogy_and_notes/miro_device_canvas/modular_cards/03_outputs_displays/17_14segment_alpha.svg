<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>

  <!-- Outer perimeter segments (A1, A2, B, C, D2, D1, E, F) -->
  <line x1="78" y1="50" x2="98" y2="50" stroke="#000000" stroke-width="1.5"/>
  <line x1="102" y1="50" x2="122" y2="50" stroke="#000000" stroke-width="1.5"/>
  <line x1="124" y1="53" x2="124" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="124" y1="88" x2="124" y2="117" stroke="#000000" stroke-width="1.5"/>
  <line x1="102" y1="120" x2="122" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="120" x2="98" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="76" y1="88" x2="76" y2="117" stroke="#000000" stroke-width="1.5"/>
  <line x1="76" y1="53" x2="76" y2="82" stroke="#000000" stroke-width="1.5"/>

  <!-- Horizontal middle splits (G1, G2) -->
  <line x1="78" y1="85" x2="98" y2="85" stroke="#000000" stroke-width="1.5"/>
  <line x1="102" y1="85" x2="122" y2="85" stroke="#000000" stroke-width="1.5"/>

  <!-- Vertical centers & diagonals (H, J, K, L, M, N) -->
  <line x1="100" y1="53" x2="100" y2="82" stroke="#888888" stroke-width="1"/>
  <line x1="100" y1="88" x2="100" y2="117" stroke="#888888" stroke-width="1"/>
  <line x1="79" y1="53" x2="97" y2="82" stroke="#888888" stroke-width="0.5"/>
  <line x1="121" y1="53" x2="103" y2="82" stroke="#888888" stroke-width="0.5"/>
  <line x1="97" y1="88" x2="79" y2="117" stroke="#888888" stroke-width="0.5"/>
  <line x1="103" y1="88" x2="121" y2="117" stroke="#888888" stroke-width="0.5"/>

  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">ALPHA DISPLAY</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">14-segment letter &amp; number readout</text>
</svg>