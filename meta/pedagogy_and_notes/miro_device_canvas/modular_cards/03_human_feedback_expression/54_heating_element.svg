<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <!-- Heating coil element -->
  <path d="M 55 95 Q 65 65 75 95 T 95 95 T 115 95 T 135 95 T 150 95" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Rising heat waves -->
  <path d="M 75 55 Q 82 45 75 35" fill="none" stroke="#888888" stroke-width="0.5"/>
  <path d="M 100 55 Q 107 45 100 35" fill="none" stroke="#888888" stroke-width="0.5"/>
  <path d="M 125 55 Q 132 45 125 35" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">HEATING ELEMENT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">radiates thermal warmth</text>
</svg>