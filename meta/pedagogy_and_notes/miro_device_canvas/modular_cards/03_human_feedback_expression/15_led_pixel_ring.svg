<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <circle cx="100" cy="85" r="40" fill="none" stroke="#888888" stroke-width="0.5"/>
  <circle cx="100" cy="50" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="125" cy="60" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="135" cy="85" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="125" cy="110" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="120" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="75" cy="110" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="65" cy="85" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="75" cy="60" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">LIGHT RING</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">multicolor light patterns</text>
</svg>