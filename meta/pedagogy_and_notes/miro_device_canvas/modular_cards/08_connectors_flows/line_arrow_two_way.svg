<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Connector card boundary -->
  <rect x="5" y="5" width="290" height="90" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="9" fill="#888888">DATA</text>


  <polygon points="45,45 58,39 58,51" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="58" y1="45" x2="242" y2="45" stroke="#000000" stroke-width="1.5"/>
  <polygon points="255,45 242,39 242,51" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <text x="150" y="75" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">TWO-WAY DUPLEX</text>
  <text x="150" y="88" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">bidirectional request &amp; response</text>
</svg>