<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Standard 200x200 card border -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top labels -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">FLOW EXAMPLE</text>
  <text x="184" y="22" font-family="Andale Mono, monospace" font-size="8" fill="#888888" text-anchor="end">EXAMPLE CARD</text>

  <!-- Line Diagram Graphic (Centered inside 200x200 canvas) -->
  <g id="line_graphic">

  <path d="M 35,50 C 65,25 75,75 100,50 C 125,25 135,75 165,50" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="100" y="35" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">~ ~ ~</text>
  </g>

  <!-- Typography -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">RADIO WAVE</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">over-the-air RF signal</text>
</svg>
