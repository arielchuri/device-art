<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Standard 200x200 card border -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top labels -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">FLOW EXAMPLE</text>
  <text x="184" y="22" font-family="Andale Mono, monospace" font-size="8" fill="#888888" text-anchor="end">EXAMPLE CARD</text>

  <!-- Line Diagram Graphic (Centered inside 200x200 canvas) -->
  <g id="line_graphic">

  <line x1="35" y1="44" x2="165" y2="44" stroke="#000000" stroke-width="1.5"/>
  <line x1="35" y1="56" x2="165" y2="56" stroke="#000000" stroke-width="1.5"/>
  <rect x="75" y="38" width="50" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="100" y="54" font-family="Andale Mono, monospace" font-size="10" fill="#000000" text-anchor="middle">I2C</text>
  </g>

  <!-- Typography -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">I2C BUS</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">SDA / SCL multi-sensor line</text>
</svg>
