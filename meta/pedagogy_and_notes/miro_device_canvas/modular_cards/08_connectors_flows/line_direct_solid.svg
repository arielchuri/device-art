<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="200" height="200" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="200"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <g transform="translate(10, 40) scale(0.60)">

  <!-- Connector card boundary -->
  <rect x="5" y="5" width="200" height="200" fill="none" stroke="#888888" stroke-width="200" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="9" fill="#888888">WIRE</text>


  <circle cx="45" cy="45" r="4" fill="url(#hatch)" stroke="#000000" stroke-width="200"/>
  <line x1="49" y1="45" x2="251" y2="45" stroke="#000000" stroke-width="200"/>
  <circle cx="255" cy="45" r="4" fill="url(#hatch)" stroke="#000000" stroke-width="200"/>
  <text x="150" y="75" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">DIRECT CONNECTION</text>
  <text x="150" y="88" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">physical wire / electrical trace</text>

  </g>
</svg>