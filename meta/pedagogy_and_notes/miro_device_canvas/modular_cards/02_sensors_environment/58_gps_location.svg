<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Satellite icon -->
  <rect x="90" y="60" width="20" height="25" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="65" y="65" width="25" height="15" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <rect x="110" y="65" width="25" height="15" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Downward positioning transmission beam -->
  <path d="M 85 95 L 100 120 L 115 95" fill="none" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <circle cx="100" cy="120" r="2" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">GPS SATELLITE</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">global coordinates / location</text>
</svg>