<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Curved strip bending -->
  <path d="M 55 110 Q 100 110 135 60" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 60 115 Q 105 115 140 65" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="55" y1="110" x2="60" y2="115" stroke="#000000" stroke-width="1"/>
  <line x1="135" y1="60" x2="140" y2="65" stroke="#000000" stroke-width="1"/>
  <!-- Flex stress lines -->
  <line x1="90" y1="96" x2="102" y2="108" stroke="#888888" stroke-width="0.5"/>
  <line x1="102" y1="84" x2="114" y2="96" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">FLEX SENSOR</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">bends or curves</text>
</svg>