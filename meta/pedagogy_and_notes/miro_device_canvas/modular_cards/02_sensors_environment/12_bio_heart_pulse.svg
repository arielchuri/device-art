<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Heart silhouette contour -->
  <path d="M 100 62 C 85 45, 55 55, 55 80 C 55 105, 100 125, 100 125 C 100 125, 145 105, 145 80 C 145 55, 115 45, 100 62" fill="none" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <!-- EKG pulse heartbeat line -->
  <polyline points="45,90 80,90 88,70 96,110 104,78 110,95 116,90 155,90" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">BIOFEEDBACK</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">heart rate / pulse / EKG</text>
</svg>