<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PORT</text>


  <!-- Outer round jack bezel -->
  <circle cx="100" cy="85" r="32" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Outer ground sleeve with hatching -->
  <circle cx="100" cy="85" r="22" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Center positive metal pin -->
  <circle cx="100" cy="85" r="6" fill="#000000"/>

  <!-- Small center-positive polarity diagram at top right -->
  <circle cx="152" cy="40" r="3" fill="none" stroke="#000000" stroke-width="0.8"/>
  <line x1="152" y1="38" x2="152" y2="42" stroke="#000000" stroke-width="0.8"/>
  <line x1="150" y1="40" x2="154" y2="40" stroke="#000000" stroke-width="0.8"/>
  <path d="M 144 40 A 10 10 0 1 1 160 40" fill="none" stroke="#000000" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">DC BARREL JACK</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">5.5mm coaxial power input</text>
</svg>