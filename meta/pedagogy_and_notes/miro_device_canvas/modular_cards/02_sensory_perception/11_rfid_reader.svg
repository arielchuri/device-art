<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <rect x="45" y="45" width="110" height="80" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="55" y="55" width="90" height="60" fill="none" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <path d="M 85 85 A 15 15 0 0 1 115 85" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 75 85 A 25 25 0 0 1 125 85" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">RFID READER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">tap card or tag</text>
</svg>