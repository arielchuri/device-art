<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Standard radiation trefoil with hatching -->
  <circle cx="100" cy="85" r="7" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- 3 fan blades -->
  <path d="M 100 78 L 90 55 A 34 34 0 0 1 110 55 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <path d="M 106 88 L 126 102 A 34 34 0 0 1 116 119 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <path d="M 94 88 L 74 102 A 34 34 0 0 0 84 119 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">RADIATION</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">nuclear / geiger count</text>
</svg>