<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">TIMING</text>


  <!-- Two converging sine waves snapping into phase lock -->
  <path d="M 25 42 Q 40 28 55 42 T 85 42" fill="none" stroke="#888888" stroke-width="1"/>
  <path d="M 25 58 Q 40 72 55 58 T 85 58" fill="none" stroke="#888888" stroke-width="1"/>
  <!-- Central phase lock bridge latch -->
  <rect x="80" y="32" width="16" height="36" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <line x1="88" y1="32" x2="88" y2="68" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PHASE LOCK (PLL)</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">synchronizes two clock rhythms</text>
</svg>