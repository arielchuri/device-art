<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">RHYTHM</text>


  <!-- Triplet grid vs Duplet grid -->
  <!-- Top: 3 beats -->
  <line x1="25" y1="38" x2="95" y2="38" stroke="#888888" stroke-width="0.8"/>
  <circle cx="35" cy="38" r="3" fill="#000000"/>
  <circle cx="60" cy="38" r="3" fill="#000000"/>
  <circle cx="85" cy="38" r="3" fill="#000000"/>
  <!-- Bottom: 2 beats -->
  <line x1="25" y1="58" x2="95" y2="58" stroke="#888888" stroke-width="0.8"/>
  <circle cx="42" cy="58" r="3.5" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <circle cx="78" cy="58" r="3.5" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Vertical phase lines -->
  <line x1="60" y1="38" x2="60" y2="58" stroke="#000000" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">POLYRHYTHM</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">3 against 2 cross-meter</text>
</svg>