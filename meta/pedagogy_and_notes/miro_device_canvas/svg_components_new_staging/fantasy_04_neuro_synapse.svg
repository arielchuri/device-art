<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">NEUROSCIENCE</text>


  <!-- Dendrite terminal & axon synaptic gap -->
  <path d="M 30 50 Q 50 35 52 50 Q 50 65 30 50" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 90 50 Q 70 35 68 50 Q 70 65 90 50" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Chemical neurotransmitter spark dots -->
  <circle cx="60" cy="46" r="1.5" fill="#000000"/>
  <circle cx="60" cy="54" r="1.5" fill="#000000"/>
  <line x1="56" y1="50" x2="64" y2="50" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SYNAPSE FIRING</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">neurotransmitter action potential</text>
</svg>