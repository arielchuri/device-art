<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">LOGIC</text>


  <rect x="25" y="40" width="22" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="36" y="54" font-family="Andale Mono, monospace" font-size="8" fill="#000000" text-anchor="middle">A</text>
  <line x1="50" y1="51" x2="70" y2="51" stroke="#000000" stroke-width="1.5"/>
  <polygon points="70,51 62,47 62,55" fill="#000000"/>
  <rect x="73" y="40" width="22" height="22" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <text x="84" y="54" font-family="Andale Mono, monospace" font-size="8" fill="#ffffff" text-anchor="middle">B</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">CHANGE STATE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">transitions from State A to B</text>
</svg>