<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">DATA</text>


  <!-- Open book / register pages with reading magnifying loupe -->
  <rect x="35" y="38" width="50" height="30" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="60" y1="38" x2="60" y2="68" stroke="#000000" stroke-width="1"/>
  <line x1="42" y1="46" x2="53" y2="46" stroke="#888888" stroke-width="0.5"/>
  <line x1="42" y1="54" x2="53" y2="54" stroke="#888888" stroke-width="0.5"/>
  <line x1="67" y1="46" x2="78" y2="46" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">READ / FETCH</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">queries register or sensor value</text>
</svg>