<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">ACTUATOR</text>


  <line x1="25" y1="50" x2="95" y2="50" stroke="#888888" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <rect x="48" y="40" width="24" height="20" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="72" y1="50" x2="92" y2="50" stroke="#000000" stroke-width="1.5"/>
  <polygon points="92,50 84,46 84,54" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">LINEAR MOVE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">translates along 1D axis</text>
</svg>