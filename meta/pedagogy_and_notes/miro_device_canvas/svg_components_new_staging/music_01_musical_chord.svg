<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">AUDIO</text>


  <!-- 3 stacked harmonic musical notes on staff line -->
  <line x1="25" y1="45" x2="95" y2="45" stroke="#888888" stroke-width="0.5"/>
  <line x1="25" y1="58" x2="95" y2="58" stroke="#888888" stroke-width="0.5"/>
  <circle cx="45" cy="58" r="4" fill="#000000"/>
  <circle cx="60" cy="51" r="4" fill="#000000"/>
  <circle cx="75" cy="45" r="4" fill="#000000"/>
  <line x1="49" y1="58" x2="49" y2="32" stroke="#000000" stroke-width="1"/>
  <line x1="64" y1="51" x2="64" y2="32" stroke="#000000" stroke-width="1"/>
  <line x1="79" y1="45" x2="79" y2="32" stroke="#000000" stroke-width="1"/>
  <line x1="49" y1="32" x2="79" y2="32" stroke="#000000" stroke-width="2"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">CHORD / HARMONY</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">multi-voice polyphony</text>
</svg>