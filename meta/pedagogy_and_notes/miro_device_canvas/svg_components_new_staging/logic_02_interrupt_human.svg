<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">HUMAN</text>


  <!-- Cognitive thought track interrupted by sudden exclamation wedge -->
  <line x1="20" y1="50" x2="48" y2="50" stroke="#888888" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="100" y2="50" stroke="#888888" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <circle cx="60" cy="50" r="14" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="60" y1="42" x2="60" y2="52" stroke="#000000" stroke-width="1.5"/>
  <circle cx="60" cy="57" r="1.5" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">HUMAN INTERRUPT</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">external distraction / disruption</text>
</svg>