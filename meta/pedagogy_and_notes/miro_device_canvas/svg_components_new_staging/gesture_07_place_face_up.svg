<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PHYSICAL</text>


  <line x1="25" y1="65" x2="95" y2="65" stroke="#888888" stroke-width="1"/>
  <rect x="40" y="48" width="40" height="17" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Upward facing eye indicator -->
  <line x1="60" y1="30" x2="60" y2="40" stroke="#000000" stroke-width="1.2"/>
  <polyline points="56,35 60,30 64,35" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PLACE FACE UP</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">rests screen/dials facing ceiling</text>
</svg>