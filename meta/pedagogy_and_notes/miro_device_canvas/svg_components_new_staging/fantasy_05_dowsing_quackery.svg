<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PSEUDO</text>


  <!-- Pendulum suspended from thread swinging across arc -->
  <line x1="60" y1="26" x2="78" y2="56" stroke="#000000" stroke-width="1"/>
  <circle cx="60" cy="26" r="2" fill="#000000"/>
  <polygon points="78,56 84,68 72,68" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <path d="M 45 68 A 35 35 0 0 0 75 68" fill="none" stroke="#888888" stroke-width="0.8" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">RADIONICS / DOWSING</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">esoteric pendulum / quack detector</text>
</svg>