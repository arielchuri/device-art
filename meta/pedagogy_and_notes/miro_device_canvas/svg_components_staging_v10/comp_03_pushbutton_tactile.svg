<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Square Metal/Plastic Housing -->
  <rect x="36" y="30" width="48" height="44" rx="2" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="40" y="34" width="40" height="36" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Round Actuator Plunger in Center -->
  <circle cx="60" cy="52" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <circle cx="60" cy="52" r="8" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- 4 Corner Solder Legs reaching left (x=0) and right (x=120) -->
  <line x1="0" y1="38" x2="36" y2="38" stroke="#000000" stroke-width="1.5"/>
  <line x1="0" y1="66" x2="36" y2="66" stroke="#000000" stroke-width="1.5"/>
  <line x1="84" y1="38" x2="120" y2="38" stroke="#000000" stroke-width="1.5"/>
  <line x1="84" y1="66" x2="120" y2="66" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="92" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">TACTILE BUTTON</text>
</svg>