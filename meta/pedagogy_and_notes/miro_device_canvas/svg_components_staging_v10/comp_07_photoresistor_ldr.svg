<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Round Clear Epoxy Face with Ceramic Base -->
  <circle cx="60" cy="42" r="18" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="60" cy="42" r="14" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Serpentine S-curve photoconductive track -->
  <path d="M 49 34 Q 60 30 71 34 Q 60 42 49 42 Q 60 50 71 50" fill="none" stroke="#000000" stroke-width="1.8"/>
  <!-- 2 Leads reaching bottom y=120 -->
  <line x1="50" y1="58" x2="50" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="70" y1="58" x2="70" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="92" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">LIGHT SENSOR</text>
</svg>