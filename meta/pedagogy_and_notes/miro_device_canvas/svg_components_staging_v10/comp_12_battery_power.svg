<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- 9V Battery Snap Terminals (Octagonal male snap + circular female snap) -->
  <rect x="36" y="32" width="48" height="26" rx="3" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Hexagon Snap -->
  <polygon points="48,38 53,41 53,49 48,52 43,49 43,41" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- Round Snap -->
  <circle cx="72" cy="45" r="5" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Red (+) and Black (-) Wire Leads reaching left x=0 and right x=120 -->
  <line x1="0" y1="45" x2="36" y2="45" stroke="#000000" stroke-width="1.5"/>
  <line x1="84" y1="45" x2="120" y2="45" stroke="#000000" stroke-width="1.5"/>
  <text x="24" y="40" font-family="Andale Mono, monospace" font-size="7" fill="#000000">+</text>
  <text x="96" y="40" font-family="Andale Mono, monospace" font-size="7" fill="#888888">-</text>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="90" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">9V / DC POWER</text>
</svg>