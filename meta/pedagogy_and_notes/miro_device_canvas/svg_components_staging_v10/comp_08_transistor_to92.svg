<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Flat-front D-shaped TO-92 epoxy casing -->
  <path d="M 44 30 L 76 30 C 80 30, 80 56, 60 56 C 40 56, 40 30, 44 30 Z" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="44" y1="30" x2="76" y2="30" stroke="#000000" stroke-width="2"/>
  <text x="60" y="44" font-family="Andale Mono, monospace" font-size="6.5" fill="#888888" text-anchor="middle">NPN</text>
  <!-- 3 Inline Leads (E, B, C) reaching bottom y=120 -->
  <line x1="48" y1="55" x2="48" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="56" x2="60" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="72" y1="55" x2="72" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="92" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">TRANSISTOR</text>
</svg>