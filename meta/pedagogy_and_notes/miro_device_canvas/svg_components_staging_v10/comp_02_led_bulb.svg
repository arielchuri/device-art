<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Domed Epoxy Bulb Body -->
  <path d="M 45 60 L 45 42 A 15 15 0 0 1 75 42 L 75 60 Z" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Base Flange Rim -->
  <rect x="42" y="60" width="36" height="4" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- Internal Anode Post & Cathode Anvil Flag -->
  <line x1="52" y1="60" x2="52" y2="46" stroke="#000000" stroke-width="1"/>
  <polygon points="68,60 68,44 60,50 64,54" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Left Lead (Longer Anode) extending to bottom y=120 -->
  <line x1="50" y1="64" x2="50" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Right Lead (Shorter Cathode) extending to bottom y=120 -->
  <line x1="70" y1="64" x2="70" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Light Ray Sparks -->
  <line x1="78" y1="34" x2="88" y2="24" stroke="#000000" stroke-width="1"/>
  <line x1="84" y1="44" x2="94" y2="38" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="96" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">5MM LED</text>
</svg>