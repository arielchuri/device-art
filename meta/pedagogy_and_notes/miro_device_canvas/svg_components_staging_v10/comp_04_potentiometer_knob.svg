<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Round Metal Can Enclosure -->
  <circle cx="60" cy="42" r="22" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- D-Shaft / Center Rotor -->
  <circle cx="60" cy="42" r="10" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <line x1="60" y1="32" x2="60" y2="52" stroke="#ffffff" stroke-width="2"/>
  <!-- 3 Bottom Terminal Legs reaching y=120 -->
  <line x1="45" y1="64" x2="45" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="64" x2="60" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="75" y1="64" x2="75" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="90" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">POTENTIOMETER</text>
</svg>