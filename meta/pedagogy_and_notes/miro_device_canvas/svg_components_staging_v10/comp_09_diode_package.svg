<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Left Anode Lead from x=0 -->
  <line x1="0" y1="52" x2="36" y2="52" stroke="#000000" stroke-width="1.5"/>
  <!-- DO-41 Black Plastic Cylindrical Body -->
  <rect x="36" y="42" width="48" height="20" rx="2" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <!-- Silver Cathode Polarized Band -->
  <rect x="72" y="42" width="8" height="20" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <!-- Right Cathode Lead to x=120 -->
  <line x1="84" y1="52" x2="120" y2="52" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="88" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">DIODE</text>
</svg>