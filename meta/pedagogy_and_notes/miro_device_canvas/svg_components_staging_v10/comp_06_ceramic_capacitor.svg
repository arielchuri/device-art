<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Round Ceramic Disc Body -->
  <circle cx="60" cy="42" r="18" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <!-- 104 Value Stamp -->
  <rect x="48" y="36" width="24" height="12" fill="#ffffff" stroke="#000000" stroke-width="0.5"/>
  <text x="60" y="45" font-family="Andale Mono, monospace" font-size="7" fill="#000000" text-anchor="middle">104</text>
  <!-- 2 Leads extending to bottom y=120 -->
  <line x1="52" y1="58" x2="52" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="68" y1="58" x2="68" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="92" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">CERAMIC CAP</text>
</svg>