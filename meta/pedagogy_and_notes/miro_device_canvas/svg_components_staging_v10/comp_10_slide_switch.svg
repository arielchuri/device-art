<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Invisible bounding canvas for modular Miro/Figma snapping -->
  <rect x="0" y="0" width="120" height="120" fill="none" stroke="none"/>


  <!-- Metal Shield Frame -->
  <rect x="38" y="34" width="44" height="26" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Top Sliding Actuator Knob -->
  <rect x="44" y="24" width="14" height="10" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- 3 Bottom Solder Pins reaching y=120 -->
  <line x1="45" y1="60" x2="45" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="120" stroke="#000000" stroke-width="1.5"/>
  <line x1="75" y1="60" x2="75" y2="120" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, placed tight to the component -->
  <text x="60" y="92" font-family="Andale Mono, monospace" font-size="8.5" fill="#000000" text-anchor="middle">SLIDE SWITCH</text>
</svg>