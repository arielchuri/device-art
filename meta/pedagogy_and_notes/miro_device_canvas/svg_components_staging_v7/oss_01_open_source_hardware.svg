<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">OPEN SOURCE</text>


  <!-- Standard Open Source Hardware gear with open keyway -->
  <path d="M 54 26 L 66 26 L 68 34 L 75 37 L 82 32 L 90 40 L 85 47 L 88 54 L 96 56 L 96 68 L 88 70 L 85 77 L 90 84 L 82 92 L 75 87 L 68 90 L 66 98 L 54 98 L 52 90 L 45 87 L 38 92 L 30 84 L 35 77 L 32 70 L 24 68 L 24 56 L 32 54 L 35 47 L 30 40 L 38 32 L 45 37 L 52 34 Z" fill="none" stroke="#000000" stroke-width="1" transform="scale(0.6) translate(40, 20)"/>
  <circle cx="60" cy="50" r="8" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">OPEN HARDWARE (OSHW)</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">open source gear logo</text>
</svg>