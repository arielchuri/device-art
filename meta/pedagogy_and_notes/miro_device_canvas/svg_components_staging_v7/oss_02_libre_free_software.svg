<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">OPEN SOURCE</text>


  <!-- Broken padlock / freedom wings -->
  <rect x="42" y="44" width="36" height="28" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Free open shackle -->
  <path d="M 48 44 L 48 32 A 12 12 0 0 1 72 32 L 72 38" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="60" y="62" font-family="Andale Mono, monospace" font-size="10" fill="#000000" text-anchor="middle">GPL</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">LIBRE SOFTWARE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">four user software freedoms</text>
</svg>