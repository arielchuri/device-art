<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EXPLOIT</text>


  <!-- Fishhook snagging an envelope / data token -->
  <path d="M 60 22 L 60 55 C 60 70, 85 70, 85 55 L 85 45" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="85,45 80,52 90,52" fill="#000000"/>
  <!-- Dangling bait envelope -->
  <rect x="35" y="45" width="26" height="18" fill="none" stroke="#000000" stroke-width="1"/>
  <polyline points="35,45 48,55 61,45" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PHISHING / BAIT</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">social engineering lure</text>
</svg>