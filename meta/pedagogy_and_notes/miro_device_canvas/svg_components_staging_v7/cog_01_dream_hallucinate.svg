<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">COGNITION</text>


  <!-- Thought cloud with crescent moon and floating stars -->
  <path d="M 38 56 C 26 56, 26 42, 38 38 C 38 24, 60 20, 72 30 C 82 22, 94 28, 94 38 C 102 42, 102 56, 90 56 Z" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="45" cy="65" r="2.5" fill="#888888"/>
  <circle cx="38" cy="72" r="1.5" fill="#888888"/>
  <polygon points="60,36 62,42 68,44 62,46 60,52 58,46 52,44 58,42" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DREAM / IMAGINE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">unconstrained creative generative state</text>
</svg>