<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">AUDIO / AI</text>


  <!-- Document converting into speaker sound waves -->
  <rect x="26" y="34" width="26" height="32" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="32" y1="42" x2="46" y2="42" stroke="#000000" stroke-width="1"/>
  <line x1="32" y1="50" x2="42" y2="50" stroke="#000000" stroke-width="1"/>
  <line x1="58" y1="50" x2="72" y2="50" stroke="#000000" stroke-width="1.2"/>
  <polygon points="72,50 66,46 66,54" fill="#000000"/>
  <!-- Sound broadcast wave -->
  <path d="M 78 40 A 15 15 0 0 1 78 60" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 86 34 A 25 25 0 0 1 86 66" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">TEXT TO SPEECH</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">synthesizes vocal audio (TTS)</text>
</svg>