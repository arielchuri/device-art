<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PHYSICAL</text>


  <!-- Knurled grip texture ridges -->
  <line x1="30" y1="35" x2="30" y2="65" stroke="#000000" stroke-width="1.5"/>
  <line x1="42" y1="35" x2="42" y2="65" stroke="#000000" stroke-width="1.5"/>
  <line x1="54" y1="35" x2="54" y2="65" stroke="#000000" stroke-width="1.5"/>
  <line x1="66" y1="35" x2="66" y2="65" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="35" x2="78" y2="65" stroke="#000000" stroke-width="1.5"/>
  <line x1="90" y1="35" x2="90" y2="65" stroke="#000000" stroke-width="1.5"/>
  <!-- Finger gliding across ridges -->
  <path d="M 25 45 Q 60 25 95 45" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">TACTILE FEEL</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">haptic ridges / surface grain</text>
</svg>