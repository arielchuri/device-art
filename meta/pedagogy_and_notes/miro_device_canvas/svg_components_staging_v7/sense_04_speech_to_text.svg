<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">AUDIO / AI</text>


  <!-- Audio sound waves converting to text glyphs -->
  <path d="M 28 42 Q 35 30 35 50 T 42 50" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="48" y1="50" x2="62" y2="50" stroke="#000000" stroke-width="1.2"/>
  <polygon points="62,50 56,46 56,54" fill="#000000"/>
  <!-- Text lines A B C -->
  <rect x="68" y="34" width="26" height="32" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="74" y1="42" x2="88" y2="42" stroke="#000000" stroke-width="1"/>
  <line x1="74" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1"/>
  <line x1="74" y1="58" x2="88" y2="58" stroke="#888888" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SPEECH TO TEXT</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">transcribes spoken audio (STT)</text>
</svg>