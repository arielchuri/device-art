<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PHYSICAL</text>


  <!-- Hatch barrier concealing internal object -->
  <rect x="25" y="32" width="70" height="20" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <circle cx="60" cy="62" r="10" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <text x="60" y="65" font-family="Andale Mono, monospace" font-size="8" fill="#888888" text-anchor="middle">?</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">OBSCURED / HIDDEN</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">concealed beneath enclosure</text>
</svg>