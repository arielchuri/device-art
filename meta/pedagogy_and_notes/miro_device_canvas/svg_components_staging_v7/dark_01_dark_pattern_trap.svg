<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">DARK UX</text>


  <!-- Deceptive click funnel trap with hidden spike pit -->
  <rect x="32" y="32" width="56" height="24" fill="none" stroke="#000000" stroke-width="1.2"/>
  <text x="60" y="47" font-family="Andale Mono, monospace" font-size="8" fill="#000000" text-anchor="middle">CLICK</text>
  <!-- Hidden trap door spring -->
  <line x1="32" y1="56" x2="52" y2="70" stroke="#000000" stroke-width="1.5"/>
  <polygon points="56,66 68,66 62,56" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">DARK PATTERN</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">deceptive coercive interface trap</text>
</svg>