<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">AI / VISION</text>


  <!-- Head outline with bounding corner brackets -->
  <path d="M 40 32 L 32 32 L 32 40" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 80 32 L 88 32 L 88 40" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 32 60 L 32 68 L 40 68" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 88 60 L 88 68 L 80 68" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Facial landmark nodes -->
  <circle cx="48" cy="46" r="2" fill="#000000"/>
  <circle cx="72" cy="46" r="2" fill="#000000"/>
  <circle cx="60" cy="54" r="1.5" fill="#000000"/>
  <polyline points="52,62 60,65 68,62" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="48" y1="46" x2="60" y2="54" stroke="#888888" stroke-width="0.5"/>
  <line x1="72" y1="46" x2="60" y2="54" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">FACE RECOGNITION</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">biometric landmark mesh</text>
</svg>