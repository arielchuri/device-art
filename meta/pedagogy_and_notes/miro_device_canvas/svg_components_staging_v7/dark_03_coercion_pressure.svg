<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">DARK UX</text>


  <!-- Clock timer with vice clamps squeezing in -->
  <circle cx="60" cy="50" r="16" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="60" y1="50" x2="60" y2="38" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="68" y2="50" stroke="#000000" stroke-width="1.5"/>
  <!-- Clamping arrows -->
  <line x1="22" y1="50" x2="38" y2="50" stroke="#000000" stroke-width="2"/>
  <polyline points="32,45 38,50 32,55" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="98" y1="50" x2="82" y2="50" stroke="#000000" stroke-width="2"/>
  <polyline points="88,45 82,50 88,55" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">COERCION / URGENCY</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">forced choice / fake countdown</text>
</svg>