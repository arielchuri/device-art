<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EXPLOIT</text>


  <!-- Radar sweep probing multiple open socket ports -->
  <circle cx="60" cy="50" r="22" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="60" y1="50" x2="76" y2="34" stroke="#000000" stroke-width="1.5"/>
  <path d="M 60 28 A 22 22 0 0 1 76 34" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <circle cx="48" cy="42" r="2" fill="#000000"/>
  <circle cx="72" cy="60" r="2" fill="url(#hatch)"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">PORT SCANNER</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">reconnaissance / socket probe</text>
</svg>