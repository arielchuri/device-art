<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PHYSICAL</text>


  <!-- Object breaking through surface water/bedrock baseline -->
  <line x1="20" y1="52" x2="100" y2="52" stroke="#000000" stroke-width="1.5"/>
  <polygon points="60,28 76,52 44,52" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <line x1="60" y1="68" x2="60" y2="40" stroke="#000000" stroke-width="1.5"/>
  <polyline points="55,45 60,40 65,45" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SURFACE (VERB)</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">emerges / rises to exterior</text>
</svg>