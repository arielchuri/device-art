<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">PORT</text>


  <!-- Outer RJ45 housing with top clip notch -->
  <polygon points="60,60 90,60 90,52 110,52 110,60 140,60 140,110 60,110" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- 8 gold contact pins -->
  <line x1="70" y1="68" x2="70" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="78" y1="68" x2="78" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="87" y1="68" x2="87" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="95" y1="68" x2="95" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="105" y1="68" x2="105" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="113" y1="68" x2="113" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="122" y1="68" x2="122" y2="82" stroke="#000000" stroke-width="1.5"/>
  <line x1="130" y1="68" x2="130" y2="82" stroke="#000000" stroke-width="1.5"/>

  <!-- Small LAN network nodes icon at top right -->
  <rect x="144" y="32" width="6" height="6" fill="#000000"/>
  <rect x="156" y="32" width="6" height="6" fill="#000000"/>
  <rect x="150" y="44" width="6" height="6" fill="#000000"/>
  <line x1="147" y1="38" x2="153" y2="44" stroke="#000000" stroke-width="0.8"/>
  <line x1="159" y1="38" x2="153" y2="44" stroke="#000000" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">ETHERNET (RJ45)</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">wired 8-pin LAN network</text>
</svg>