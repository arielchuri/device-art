<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">SECURITY</text>


  <!-- Security Shield with embedded Key -->
  <path d="M 65 55 L 100 45 L 135 55 L 135 85 C 135 110, 100 125, 100 125 C 100 125, 65 110, 65 85 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Key icon inside -->
  <circle cx="100" cy="72" r="6" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="100" y1="78" x2="100" y2="102" stroke="#000000" stroke-width="1"/>
  <line x1="100" y1="92" x2="108" y2="92" stroke="#000000" stroke-width="1"/>
  <line x1="100" y1="100" x2="106" y2="100" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">AUTH TOKEN / KEY</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">bearer token &amp; cryptographic key</text>
</svg>