<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INTELLIGENCE</text>


  <!-- Central agent core avatar / spark -->
  <circle cx="100" cy="85" r="18" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <!-- Continuous reasoning & tool feedback orbit loop -->
  <path d="M 68 85 A 32 32 0 1 1 132 85" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polyline points="126,78 132,85 124,88" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 132 85 A 32 32 0 1 1 68 85" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polyline points="74,92 68,85 76,82" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">AI AGENT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">autonomous tool execution loop</text>
</svg>