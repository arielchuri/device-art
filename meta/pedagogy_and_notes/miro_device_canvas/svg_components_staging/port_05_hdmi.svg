  <rect x="140" y="32" width="24" height="16" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="152" y="44" font-family="Andale Mono, monospace" font-size="8" fill="#000000" text-anchor="middle">HD</text>
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">HDMI PORT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">digital video &amp; multi-channel audio</text>
