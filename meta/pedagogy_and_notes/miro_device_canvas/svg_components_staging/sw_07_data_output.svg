<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">DATA</text>


  <!-- Terminal response container with curly braces -->
  <rect x="45" y="60" width="110" height="50" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="58" y="90" font-family="Andale Mono, monospace" font-size="14" fill="#000000">{</text>
  <line x1="72" y1="78" x2="115" y2="78" stroke="#000000" stroke-width="1"/>
  <line x1="72" y1="92" x2="135" y2="92" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <text x="142" y="90" font-family="Andale Mono, monospace" font-size="14" fill="#000000">}</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">DATA OUTPUT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">inference response / JSON out</text>
</svg>