<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">LOGIC</text>

  <circle cx="100" cy="85" r="30" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 100 85 L 100 55 A 30 30 0 0 1 126 70 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="100" y1="85" x2="100" y2="55" stroke="#000000" stroke-width="1.5"/>
  <line x1="100" y1="85" x2="126" y2="70" stroke="#000000" stroke-width="1.5"/>
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">DELAY / TIMER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">countdown pause before next step</text>
</svg>