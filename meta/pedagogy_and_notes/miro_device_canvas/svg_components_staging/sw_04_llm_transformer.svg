<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INTELLIGENCE</text>


  <!-- 3-layer neural network with interconnected weight nodes -->
  <!-- Layer 1 -->
  <circle cx="65" cy="62" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="65" cy="85" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="65" cy="108" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Layer 2 (Hidden) -->
  <circle cx="100" cy="52" r="5" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <circle cx="100" cy="74" r="5" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <circle cx="100" cy="96" r="5" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <circle cx="100" cy="118" r="5" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Layer 3 (Output) -->
  <circle cx="135" cy="74" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="135" cy="96" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Synaptic connection lines -->
  <line x1="70" y1="62" x2="95" y2="52" stroke="#888888" stroke-width="0.5"/>
  <line x1="70" y1="62" x2="95" y2="74" stroke="#888888" stroke-width="0.5"/>
  <line x1="70" y1="85" x2="95" y2="74" stroke="#888888" stroke-width="0.5"/>
  <line x1="70" y1="85" x2="95" y2="96" stroke="#888888" stroke-width="0.5"/>
  <line x1="70" y1="108" x2="95" y2="96" stroke="#888888" stroke-width="0.5"/>
  <line x1="70" y1="108" x2="95" y2="118" stroke="#888888" stroke-width="0.5"/>
  <line x1="105" y1="74" x2="130" y2="74" stroke="#888888" stroke-width="0.5"/>
  <line x1="105" y1="96" x2="130" y2="96" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">LLM / NEURAL NET</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">deep learning foundation model</text>
</svg>