<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PRIVACY</text>


  <!-- Memory box with lit bomb fuse / flame burn -->
  <rect x="36" y="44" width="48" height="30" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 60 44 Q 60 30 75 30 Q 85 30 82 20" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Spark flame burst -->
  <polygon points="82,20 86,14 80,16 82,10 76,14 74,8 74,18" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <line x1="44" y1="58" x2="76" y2="58" stroke="#888888" stroke-width="0.8" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">EPHEMERAL BURN</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">self-deleting memory timer</text>
</svg>