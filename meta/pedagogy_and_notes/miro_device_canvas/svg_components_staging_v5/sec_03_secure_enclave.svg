<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">HARDWARE</text>


  <!-- Armored silicon die with perimeter vault teeth -->
  <rect x="36" y="30" width="48" height="42" fill="none" stroke="#000000" stroke-width="1.5"/>
  <rect x="44" y="38" width="32" height="26" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Keyhole in center of chip -->
  <circle cx="60" cy="48" r="2.5" fill="#ffffff"/>
  <polygon points="58.5,49 61.5,49 62.5,56 57.5,56" fill="#ffffff"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SECURE ELEMENT</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">tamper-proof crypto enclave</text>
</svg>