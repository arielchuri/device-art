<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <!-- Central person surrounded by 3 watching gaze lines -->
  <circle cx="60" cy="50" r="8" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Omnipresent surveillance cones -->
  <path d="M 25 30 L 48 45" stroke="#000000" stroke-width="1"/>
  <path d="M 95 30 L 72 45" stroke="#000000" stroke-width="1"/>
  <path d="M 60 80 L 60 62" stroke="#000000" stroke-width="1"/>
  <circle cx="25" cy="30" r="3" fill="#000000"/>
  <circle cx="95" cy="30" r="3" fill="#000000"/>
  <circle cx="60" cy="80" r="3" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SURVEILLED</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">feeling of being tracked / watched</text>
</svg>