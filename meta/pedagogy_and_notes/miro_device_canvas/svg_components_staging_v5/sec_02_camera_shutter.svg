<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PRIVACY</text>


  <!-- Optical aperture lens with sliding physical blind -->
  <circle cx="60" cy="48" r="16" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="60" cy="48" r="6" fill="#000000"/>
  <!-- Sliding cover plate halfway blocking lens -->
  <rect x="52" y="30" width="30" height="36" fill="url(#hatch)" stroke="#000000" stroke-width="1"/>
  <line x1="52" y1="30" x2="52" y2="66" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">CAMERA SHUTTER</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">physical lens cover slide</text>
</svg>