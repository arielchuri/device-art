<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">HARDWARE</text>


  <!-- Two disconnected islands with empty chasm between -->
  <rect x="22" y="35" width="30" height="34" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="68" y="35" width="30" height="34" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="56" y1="30" x2="64" y2="74" stroke="#000000" stroke-width="1.5"/>
  <!-- Void air gap icon -->
  <text x="60" y="26" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">VOID</text>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">AIR GAP</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">zero physical network interface</text>
</svg>