<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">SECURITY</text>


  <!-- Two padlocks flanking cipher tunnel pipe -->
  <rect x="25" y="44" width="16" height="14" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 28 44 L 28 38 A 5 5 0 0 1 38 38 L 38 44" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="79" y="44" width="16" height="14" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 82 44 L 82 38 A 5 5 0 0 1 92 38 L 92 44" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Encrypted scrambled bit pipeline -->
  <line x1="41" y1="51" x2="79" y2="51" stroke="#000000" stroke-width="1.5" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">E2E ENCRYPTION</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">zero-knowledge cipher tunnel</text>
</svg>