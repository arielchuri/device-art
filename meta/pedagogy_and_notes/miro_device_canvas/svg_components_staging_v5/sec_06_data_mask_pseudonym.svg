<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">PRIVACY</text>


  <!-- Venetian masquerade mask covering data vector -->
  <path d="M 32 44 C 42 34, 52 48, 60 48 C 68 48, 78 34, 88 44 C 92 58, 76 65, 60 56 C 44 65, 28 58, 32 44 Z" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <circle cx="46" cy="46" r="3" fill="#ffffff"/>
  <circle cx="74" cy="46" r="3" fill="#ffffff"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">ANONYMIZER / MASK</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">obfuscates telemetry &amp; identity</text>
</svg>