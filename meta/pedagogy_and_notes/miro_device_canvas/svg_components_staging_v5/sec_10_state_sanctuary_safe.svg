<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">EMOTION</text>


  <!-- Protective umbrella / vault dome shelter -->
  <path d="M 30 50 A 30 30 0 0 1 90 50 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="60" cy="58" r="6" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Falling telemetry rays blocked by roof -->
  <line x1="42" y1="16" x2="42" y2="28" stroke="#888888" stroke-width="0.8"/>
  <line x1="60" y1="12" x2="60" y2="24" stroke="#888888" stroke-width="0.8"/>
  <line x1="78" y1="16" x2="78" y2="28" stroke="#888888" stroke-width="0.8"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">SANCTUARY / SAFE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">unmonitored peaceful zone</text>
</svg>