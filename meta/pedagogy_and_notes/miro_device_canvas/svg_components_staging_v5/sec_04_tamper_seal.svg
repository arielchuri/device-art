<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="6" y="6" width="108" height="108" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="7.5" fill="#888888">HARDWARE</text>


  <!-- Broken adhesive seal tape across chassis seam -->
  <line x1="20" y1="50" x2="100" y2="50" stroke="#888888" stroke-width="1"/>
  <!-- Jagged fractured seal -->
  <polygon points="40,38 80,38 72,50 80,62 40,62 48,50" fill="url(#hatch)" stroke="#000000" stroke-width="0.8"/>
  <polyline points="58,38 62,44 56,54 64,62" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="60" y="94" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">TAMPER EVIDENCE</text>
  <text x="60" y="106" font-family="Andale Mono, monospace" font-size="7" fill="#888888" text-anchor="middle">void tape / seal broken detection</text>
</svg>