<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Sun core -->
  <circle cx="100" cy="85" r="16" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Radiating sun rays -->
  <line x1="100" y1="55" x2="100" y2="45" stroke="#000000" stroke-width="0.5"/>
  <line x1="100" y1="115" x2="100" y2="125" stroke="#000000" stroke-width="0.5"/>
  <line x1="70" y1="85" x2="60" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="130" y1="85" x2="140" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="79" y1="64" x2="72" y2="57" stroke="#000000" stroke-width="0.5"/>
  <line x1="121" y1="106" x2="128" y2="113" stroke="#000000" stroke-width="0.5"/>
  <line x1="79" y1="106" x2="72" y2="113" stroke="#000000" stroke-width="0.5"/>
  <line x1="121" y1="64" x2="128" y2="57" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">LIGHT SENSOR</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">sunlight / shadow detection</text>
</svg>