<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Translucent card background: 10% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.10" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="24" y="30" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <rect x="45" y="65" width="110" height="65" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="58" y1="72" x2="142" y2="72" stroke="#000000" stroke-width="1"/>
  <polygon points="65,72 135,72 135,38 128,42 121,38 114,42 107,38 100,42 93,38 86,42 79,38 72,42 65,38" fill="none" stroke="#000000" stroke-width="0.5"/>
  <line x1="75" y1="48" x2="125" y2="48" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <line x1="75" y1="56" x2="115" y2="56" stroke="#888888" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">PRINTER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">prints paper receipt</text>
</svg>