<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Connector card boundary -->
  <rect x="5" y="5" width="290" height="90" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <text x="12" y="18" font-family="Andale Mono, monospace" font-size="9" fill="#888888">WIRELESS</text>


  <line x1="40" y1="45" x2="115" y2="45" stroke="#000000" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <!-- Miniature BT rune badge in middle -->
  <circle cx="150" cy="45" r="14" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="150" y1="36" x2="150" y2="54" stroke="#000000" stroke-width="1"/>
  <polyline points="144,40 156,48 150,54 150,36 156,42 144,50" fill="none" stroke="#000000" stroke-width="0.8"/>
  <line x1="185" y1="45" x2="260" y2="45" stroke="#000000" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>
  <text x="150" y="75" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">BLUETOOTH LINK</text>
  <text x="150" y="88" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">BLE paired communication stream</text>
</svg>