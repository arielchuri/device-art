<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">CONNECT</text>


  <!-- Central trunk & arrow head -->
  <line x1="100" y1="120" x2="100" y2="48" stroke="#000000" stroke-width="1.5"/>
  <polygon points="100,42 94,52 106,52" fill="#000000"/>
  <!-- Bottom base circle -->
  <circle cx="100" cy="120" r="5" fill="#000000"/>
  
  <!-- Left branch & square terminal -->
  <path d="M 100 98 Q 72 94 72 74 L 72 65" fill="none" stroke="#000000" stroke-width="1.5"/>
  <rect x="67" y="55" width="10" height="10" fill="#000000"/>

  <!-- Right branch & circle terminal -->
  <path d="M 100 86 Q 128 82 128 72 L 128 65" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="128" cy="60" r="5" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">USB PORT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">wired computer &amp; power link</text>
</svg>