<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">CONNECT</text>


  <rect x="55" y="80" width="90" height="40" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Antennas -->
  <line x1="75" y1="80" x2="65" y2="50" stroke="#000000" stroke-width="1"/>
  <line x1="125" y1="80" x2="135" y2="50" stroke="#000000" stroke-width="1"/>
  <!-- Broadcast arcs -->
  <path d="M 85 55 A 15 15 0 0 1 115 55" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 75 45 A 25 25 0 0 1 125 45" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">WIFI ACCESS POINT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">creates local wifi network</text>
</svg>