<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <rect x="82" y="45" width="36" height="60" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 70 75 A 30 30 0 0 0 130 75" fill="none" stroke="#000000" stroke-width="0.5"/>
  <line x1="100" y1="105" x2="100" y2="125" stroke="#000000" stroke-width="1"/>
  <line x1="80" y1="125" x2="120" y2="125" stroke="#000000" stroke-width="1"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">MICROPHONE</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">listens to sound or voice</text>
</svg>