<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <!-- 14-segment starburst layout -->
  <line x1="82" y1="52" x2="118" y2="52" stroke="#000000" stroke-width="2"/>
  <line x1="80" y1="54" x2="80" y2="116" stroke="#000000" stroke-width="2"/>
  <line x1="120" y1="54" x2="120" y2="116" stroke="#000000" stroke-width="2"/>
  <line x1="82" y1="118" x2="118" y2="118" stroke="#000000" stroke-width="2"/>
  <line x1="82" y1="85" x2="98" y2="85" stroke="#000000" stroke-width="2"/>
  <line x1="102" y1="85" x2="118" y2="85" stroke="#000000" stroke-width="2"/>
  <!-- Center verticals & diagonals -->
  <line x1="100" y1="54" x2="100" y2="83" stroke="#888888" stroke-width="0.5"/>
  <line x1="100" y1="87" x2="100" y2="116" stroke="#888888" stroke-width="0.5"/>
  <line x1="82" y1="54" x2="98" y2="83" stroke="#888888" stroke-width="0.5"/>
  <line x1="118" y1="54" x2="102" y2="83" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">ALPHA DISPLAY</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">14-segment letter/number readout</text>
</svg>