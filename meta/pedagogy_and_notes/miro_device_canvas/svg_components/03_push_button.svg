<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Translucent card background: 10% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.10" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label -->
  <text x="24" y="30" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <rect x="50" y="50" width="100" height="75" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="75" y="65" width="50" height="45" fill="none" stroke="#000000" stroke-width="0.5"/>
  <line x1="100" y1="32" x2="100" y2="55" stroke="#000000" stroke-width="0.5"/>
  <polyline points="96,50 100,55 104,50" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">BUTTON</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">push or hold</text>
</svg>