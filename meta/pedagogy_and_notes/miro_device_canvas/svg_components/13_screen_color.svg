<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <rect x="35" y="40" width="130" height="85" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="45" y="50" width="110" height="65" fill="none" stroke="#888888" stroke-width="0.5"/>
  <polygon points="55,100 80,70 100,90 120,60 145,100" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="130" cy="65" r="6" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">COLOR SCREEN</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">high-res graphic UX</text>
</svg>