<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">POWER</text>


  <rect x="45" y="50" width="110" height="70" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="82" y1="50" x2="82" y2="120" stroke="#888888" stroke-width="0.5"/>
  <line x1="118" y1="50" x2="118" y2="120" stroke="#888888" stroke-width="0.5"/>
  <line x1="58" y1="85" x2="70" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="64" y1="79" x2="64" y2="91" stroke="#000000" stroke-width="0.5"/>
  <line x1="94" y1="85" x2="106" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="130" y1="85" x2="142" y2="85" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">BATTERY PACK</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">replaceable AA/AAA cells</text>
</svg>