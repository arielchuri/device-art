<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <circle cx="100" cy="85" r="28" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 55 65 Q 50 85 55 105" fill="none" stroke="#888888" stroke-width="0.5"/>
  <path d="M 47 60 Q 40 85 47 110" fill="none" stroke="#888888" stroke-width="0.5"/>
  <path d="M 145 65 Q 150 85 145 105" fill="none" stroke="#888888" stroke-width="0.5"/>
  <path d="M 153 60 Q 160 85 153 110" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">VIBRATION</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">buzzing tactile pulse</text>
</svg>