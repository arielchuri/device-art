<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Gauge dial outline -->
  <circle cx="100" cy="85" r="32" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Downward atmospheric pressure arrows -->
  <line x1="85" y1="40" x2="85" y2="60" stroke="#888888" stroke-width="0.5"/>
  <polyline points="82,55 85,60 88,55" fill="none" stroke="#888888" stroke-width="0.5"/>
  <line x1="115" y1="40" x2="115" y2="60" stroke="#888888" stroke-width="0.5"/>
  <polyline points="112,55 115,60 118,55" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Meter needle -->
  <line x1="100" y1="85" x2="120" y2="70" stroke="#000000" stroke-width="1.5"/>
  <circle cx="100" cy="85" r="4" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">BAROMETER / ALTI</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">air pressure &amp; altitude</text>
</svg>