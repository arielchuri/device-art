  <line x1="60" y1="45" x2="75" y2="60" stroke="#888888" stroke-width="0.5"/>
  <polyline points="70,60 75,60 75,55" fill="none" stroke="#888888" stroke-width="0.5"/>
  <line x1="75" y1="35" x2="90" y2="50" stroke="#888888" stroke-width="0.5"/>
