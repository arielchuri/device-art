<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <rect x="45" y="35" width="110" height="95" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- 5x5 dot matrix grid -->
  <!-- Row 1 -->
  <circle cx="65" cy="55" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="82" cy="55" r="3" fill="#000000"/>
  <circle cx="100" cy="55" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="118" cy="55" r="3" fill="#000000"/>
  <circle cx="135" cy="55" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Row 2 -->
  <circle cx="65" cy="72" r="3" fill="#000000"/>
  <circle cx="82" cy="72" r="3" fill="#000000"/>
  <circle cx="100" cy="72" r="3" fill="#000000"/>
  <circle cx="118" cy="72" r="3" fill="#000000"/>
  <circle cx="135" cy="72" r="3" fill="#000000"/>
  <!-- Row 3 -->
  <circle cx="65" cy="90" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="82" cy="90" r="3" fill="#000000"/>
  <circle cx="100" cy="90" r="3" fill="#000000"/>
  <circle cx="118" cy="90" r="3" fill="#000000"/>
  <circle cx="135" cy="90" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Row 4 -->
  <circle cx="65" cy="108" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="82" cy="108" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="100" cy="108" r="3" fill="#000000"/>
  <circle cx="118" cy="108" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="135" cy="108" r="3" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">LED MATRIX</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">8x8 pixel grid icon</text>
</svg>