  <!-- Top-left category label -->
  <text x="24" y="30" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <polygon points="65,72 85,72 108,52 108,118 85,98 65,98" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 120 72 A 18 18 0 0 1 120 98" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 130 62 A 32 32 0 0 1 130 108" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">SPEAKER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">plays sound or voice</text>
