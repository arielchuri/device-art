<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <!-- 3 overlapping / grouped light rays -->
  <circle cx="100" cy="85" r="22" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="85" r="12" fill="none" stroke="#888888" stroke-width="0.5"/>
  <circle cx="100" cy="85" r="3" fill="#000000"/>
  <!-- RGB dispersion rays -->
  <line x1="100" y1="52" x2="100" y2="40" stroke="#000000" stroke-width="0.5"/>
  <line x1="124" y1="61" x2="133" y2="52" stroke="#000000" stroke-width="0.5"/>
  <line x1="133" y1="85" x2="145" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="67" y1="85" x2="55" y2="85" stroke="#000000" stroke-width="0.5"/>
  <line x1="76" y1="61" x2="67" y2="52" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">RGB LED</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">multicolor light output</text>
</svg>