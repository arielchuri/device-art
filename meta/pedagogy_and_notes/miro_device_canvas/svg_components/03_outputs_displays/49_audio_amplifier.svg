<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <!-- Standard Op-Amp triangle symbol -->
  <polygon points="60,50 140,85 60,120" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Non-inverting / Inverting inputs -->
  <line x1="45" y1="65" x2="60" y2="65" stroke="#000000" stroke-width="1"/>
  <line x1="45" y1="105" x2="60" y2="105" stroke="#000000" stroke-width="1"/>
  <line x1="70" y1="65" x2="78" y2="65" stroke="#888888" stroke-width="0.5"/>
  <line x1="74" y1="61" x2="74" y2="69" stroke="#888888" stroke-width="0.5"/>
  <line x1="70" y1="105" x2="78" y2="105" stroke="#888888" stroke-width="0.5"/>
  <!-- Output -->
  <line x1="140" y1="85" x2="160" y2="85" stroke="#000000" stroke-width="1.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">AUDIO AMPLIFIER</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">boosts sound signal &amp; power</text>
</svg>