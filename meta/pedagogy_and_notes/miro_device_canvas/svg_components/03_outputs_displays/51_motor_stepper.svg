<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">OUTPUT</text>


  <circle cx="100" cy="85" r="30" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="85" r="10" fill="url(#hatch)" stroke="#000000" stroke-width="0.5"/>
  <!-- 4 Stepper poles -->
  <rect x="95" y="47" width="10" height="8" fill="none" stroke="#000000" stroke-width="0.5"/>
  <rect x="95" y="115" width="10" height="8" fill="none" stroke="#000000" stroke-width="0.5"/>
  <rect x="62" y="80" width="8" height="10" fill="none" stroke="#000000" stroke-width="0.5"/>
  <rect x="130" y="80" width="8" height="10" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">STEPPER MOTOR</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">step-by-step indexing motor</text>
</svg>