<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Airflow vapor drift lines -->
  <path d="M 50 65 Q 75 55 100 70 T 150 60" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 45 85 Q 70 75 95 90 T 155 80" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 55 105 Q 80 95 105 110 T 145 100" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Floating particulate dots -->
  <circle cx="70" cy="78" r="1.5" fill="#000000"/>
  <circle cx="120" cy="72" r="1.5" fill="#000000"/>
  <circle cx="85" cy="98" r="1.5" fill="#000000"/>
  <circle cx="135" cy="92" r="1.5" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">AIR QUALITY</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">gas / smoke / particle drift</text>
</svg>