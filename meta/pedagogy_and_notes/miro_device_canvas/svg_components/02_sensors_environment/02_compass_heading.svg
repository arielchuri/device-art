<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Translucent card background: 15% opacity white + thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <circle cx="100" cy="85" r="34" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Compass needle / star -->
  <polygon points="100,56 106,85 100,80 94,85" fill="#000000" stroke="#000000" stroke-width="0.5"/>
  <polygon points="100,114 106,85 100,90 94,85" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Cardinal tick marks -->
  <line x1="100" y1="46" x2="100" y2="50" stroke="#888888" stroke-width="0.5"/>
  <line x1="100" y1="120" x2="100" y2="124" stroke="#888888" stroke-width="0.5"/>
  <line x1="61" y1="85" x2="65" y2="85" stroke="#888888" stroke-width="0.5"/>
  <line x1="135" y1="85" x2="139" y2="85" stroke="#888888" stroke-width="0.5"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">COMPASS</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">senses north / heading</text>
</svg>