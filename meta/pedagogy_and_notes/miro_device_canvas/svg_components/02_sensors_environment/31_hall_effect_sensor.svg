<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Standard 45-degree hatching pattern for replacing black fills -->
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Sensor chip package -->
  <polygon points="50,75 80,65 80,105 50,95" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Magnet block with N / S poles -->
  <rect x="110" y="65" width="40" height="40" fill="none" stroke="#000000" stroke-width="1"/>
  <line x1="130" y1="65" x2="130" y2="105" stroke="#000000" stroke-width="0.5"/>
  <text x="120" y="89" font-family="Andale Mono, monospace" font-size="9" fill="#000000" text-anchor="middle">N</text>
  <text x="140" y="89" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">S</text>
  <!-- Magnetic field flux lines -->
  <path d="M 110 75 Q 95 85 110 95" fill="none" stroke="#000000" stroke-width="0.5" stroke-dasharray="0, 3" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">HALL EFFECT</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">detects magnet proximity</text>
</svg>