<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">CONNECT</text>


  <!-- Base broadcast focal point -->
  <circle cx="100" cy="116" r="4.5" fill="#000000"/>

  <!-- Inner arc (radius 22) -->
  <path d="M 82 98 A 24 24 0 0 1 118 98" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Middle arc (radius 42) -->
  <path d="M 68 80 A 46 46 0 0 1 132 80" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Outer arc (radius 62) -->
  <path d="M 54 62 A 68 68 0 0 1 146 62" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">WI-FI</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">wireless network / internet data</text>
</svg>