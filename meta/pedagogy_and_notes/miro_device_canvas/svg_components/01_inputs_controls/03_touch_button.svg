<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Square button housing -->
  <rect x="55" y="45" width="90" height="80" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Interior concentric touch ring target -->
  <circle cx="100" cy="85" r="22" fill="none" stroke="#888888" stroke-width="0.5"/>
  <circle cx="100" cy="85" r="14" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="85" r="4" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">TOUCH BUTTON</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">contact sensor pad</text>
</svg>