<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Card boundary: thick dotted outline -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="0, 4" stroke-linecap="round"/>

  <!-- Top-left category label (tight to border) -->
  <text x="16" y="22" font-family="Andale Mono, monospace" font-size="9" fill="#888888">INPUT</text>


  <!-- Standard 120x75 screen frame -->
  <rect x="40" y="45" width="120" height="75" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="48" y="53" width="104" height="59" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Mountain graphic -->
  <polygon points="56,98 78,72 96,90 114,64 136,98" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="124" cy="68" r="5" fill="none" stroke="#888888" stroke-width="0.5"/>
  <!-- Finger tapping the screen from bottom -->
  <path d="M 85 130 L 85 88 A 9 9 0 0 1 103 88 L 103 130" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="94" cy="88" r="2.5" fill="#000000"/>
  <!-- Typography: Andale Mono, 2 sizes, regular only -->
  <text x="100" y="152" font-family="Andale Mono, monospace" font-size="12" fill="#000000" text-anchor="middle">TOUCH SCREEN</text>
  <text x="100" y="170" font-family="Andale Mono, monospace" font-size="9" fill="#888888" text-anchor="middle">interactive display tap</text>
</svg>